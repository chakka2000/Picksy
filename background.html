<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PICKSY — Know Me Before I Buy</title>

<!-- Added only for the requested typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =========================
   BASIC RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#075A61;
    --navy2:#043F45;
    --blue:#3F9FA8;
    --blue2:#6BBBC2;

    --white:#FFFFFF;
    --ivory:#F7F5EF;
    --aqua:#B9DDE0;
    --light-blue:#E8F3F5;

    --text:#16383C;
    --muted:#687D80;
    --border:#DCE8E9;

    --green:#168653;
    --red:#C63D3D;

    --shadow:0 10px 35px rgba(7,90,97,.09);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Inter",Segoe UI,Arial,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(185,221,224,.45),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(63,159,168,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(185,221,224,.28),
            transparent 32%
        ),
        linear-gradient(
            180deg,
            #FFFFFF 0%,
            #F7F5EF 55%,
            #F1F8F8 100%
        );

    min-height:100vh;
    overflow-x:hidden;
}


/* =========================
   SUBTLE OCEAN TEXTURE
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;

    opacity:.28;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 8px,
            rgba(63,159,168,.025) 9px,
            transparent 10px
        );
}


/* =========================
   TYPOGRAPHY
========================= */

h1,
h2,
h3,
h4{
    font-family:"Playfair Display",Georgia,serif;
    color:var(--navy2);
    letter-spacing:-.02em;
}

h1{
    font-size:clamp(32px,6vw,54px);
    line-height:1.08;
}

h2{
    font-size:34px;
    margin-bottom:10px;
}

h3{
    margin-bottom:8px;
}

p{
    color:var(--muted);
    line-height:1.7;
    margin-bottom:10px;
}


/* =========================
   BUTTONS
========================= */

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.btn{
    border:0;
    border-radius:999px;
    padding:12px 20px;
    font-weight:600;
    font-size:14px;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.primary{
    background:
        linear-gradient(
            135deg,
            var(--navy),
            var(--blue)
        );

    color:white;

    box-shadow:
        0 8px 22px rgba(7,90,97,.18);
}

.primary:hover{
    transform:translateY(-2px);

    box-shadow:
        0 13px 30px rgba(7,90,97,.25);
}

.secondary{
    background:rgba(255,255,255,.92);

    border:1px solid var(--border);

    color:var(--navy);
}

.secondary:hover{
    transform:translateY(-2px);

    background:var(--light-blue);

    border-color:var(--blue);
}


/* =========================
   STARTUP POPUP
========================= */

.startup{
    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(185,221,224,.30),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(63,159,168,.25),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #043F45,
            #075A61,
            #3F9FA8
        );

    animation:startupFade 3.2s forwards;
}

.startup-box{
    text-align:center;
    color:white;
    animation:logoReveal 1.8s ease;
}

.startup-box h1{
    font-family:"Playfair Display",Georgia,serif;

    color:white;

    font-size:clamp(55px,12vw,110px);

    letter-spacing:12px;

    margin-bottom:10px;

    text-shadow:
        0 0 35px rgba(185,221,224,.45);
}

.startup-box p{
    color:#DDF1F2;

    letter-spacing:4px;

    font-size:14px;
}

.startup-line{
    width:80px;
    height:2px;

    background:var(--aqua);

    margin:25px auto;

    border-radius:10px;
}

@keyframes logoReveal{
    from{
        opacity:0;
        transform:scale(.7);
        filter:blur(12px);
    }

    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

@keyframes startupFade{
    0%,80%{
        opacity:1;
        visibility:visible;
    }

    100%{
        opacity:0;
        visibility:hidden;
    }
}


/* =========================
   NAVBAR
========================= */

.topbar{
    position:sticky;
    top:0;
    z-index:100;

    background:
        rgba(255,255,255,.90);

    backdrop-filter:blur(16px);

    border-bottom:
        1px solid rgba(7,90,97,.10);
}

.topbar-inner{
    max-width:1150px;
    margin:auto;

    padding:14px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:"Playfair Display",Georgia,serif;

    font-size:24px;
    font-weight:bold;

    color:var(--navy);

    letter-spacing:3px;
}

.navlinks{
    display:flex;
    gap:22px;
}

.navlinks button{
    background:none;
    border:0;

    color:#536D70;

    font-size:14px;

    transition:
        color .2s ease;
}

.navlinks button:hover{
    color:var(--navy);
}

@media(max-width:700px){
    .navlinks{
        display:none;
    }
}


/* =========================
   APP
========================= */

#app{
    max-width:1150px;
    margin:auto;
    padding:0 20px;
}

.section{
    padding:55px 0;

    animation:
        sectionFade .55s ease both;
}

@keyframes sectionFade{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card{
    background:
        rgba(255,255,255,.94);

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:22px;

    box-shadow:var(--shadow);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}

.card:hover{
    border-color:
        rgba(63,159,168,.30);

    box-shadow:
        0 18px 45px rgba(7,90,97,.12);
}

.grid{
    display:grid;
    gap:18px;
}

.g2{
    grid-template-columns:repeat(2,1fr);
}

.g3{
    grid-template-columns:repeat(3,1fr);
}

.g4{
    grid-template-columns:repeat(4,1fr);
}

@media(max-width:850px){
    .g3,.g4{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .g2,.g3,.g4{
        grid-template-columns:1fr;
    }
}


/* =========================
   BACK BUTTON
========================= */

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;

    border:0;
    background:transparent;

    color:var(--navy);

    font-weight:600;

    margin-bottom:22px;
    padding:5px 0;

    transition:
        color .2s ease,
        transform .2s ease;
}

.back-btn:hover{
    color:var(--blue);
    transform:translateX(-3px);
}


/* =========================
   HOME
========================= */

.hero{
    text-align:center;

    padding:100px 0 70px;

    color:var(--text);

    position:relative;
}

.hero::before{
    content:"";

    position:absolute;

    width:700px;
    height:420px;

    left:50%;
    top:20px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(185,221,224,.48),
            rgba(185,221,224,.12) 45%,
            transparent 72%
        );

    filter:blur(10px);

    z-index:-1;
}

.hero h1{
    color:var(--navy2);

    max-width:900px;

    margin:auto;
}

.hero p{
    color:#647A7D;

    max-width:650px;

    margin:15px auto 25px;

    font-size:17px;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}


/* =========================
   CATEGORY CARDS
========================= */

.category-card{
    text-align:center;
    cursor:pointer;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}

.category-card:hover{
    transform:translateY(-6px);

    border-color:
        rgba(63,159,168,.35);

    box-shadow:
        0 18px 40px rgba(7,90,97,.12);
}

.category-icon{
    font-size:48px;
    margin-bottom:12px;
}


/* =========================
   ITEM CARDS
========================= */

.item-card{
    cursor:pointer;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;

    text-align:center;
}

.item-card:hover{
    transform:translateY(-5px);

    border-color:
        rgba(63,159,168,.35);

    box-shadow:
        0 18px 40px rgba(7,90,97,.12);
}

.item-icon{
    font-size:42px;
    margin-bottom:10px;
}


/* =========================
   BRAND CARDS
========================= */

.brand-card{
    cursor:pointer;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}

.brand-card:hover{
    transform:translateY(-5px);

    border-color:
        rgba(63,159,168,.35);

    box-shadow:
        0 18px 40px rgba(7,90,97,.12);
}

.brand-circle{
    width:60px;
    height:60px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            var(--navy),
            var(--blue)
        );

    margin-bottom:12px;

    box-shadow:
        0 8px 20px rgba(7,90,97,.16);
}


/* =========================
   PRODUCT CARDS
========================= */

.product-card{
    cursor:pointer;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;

    position:relative;
}

.product-card:hover{
    transform:translateY(-5px);

    box-shadow:
        0 18px 40px rgba(7,90,97,.12);

    border-color:
        rgba(63,159,168,.30);
}

.product-img{
    height:170px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #E5F2F3,
            #F8FBFB
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:65px;

    margin-bottom:15px;
}

.price{
    font-size:20px;

    font-weight:bold;

    color:var(--navy2);
}

.pill{
    display:inline-block;

    padding:5px 10px;

    border-radius:20px;

    font-size:12px;

    font-weight:600;

    margin-top:8px;
}

.blue{
    background:#E5F2F3;
    color:var(--navy);
}

.green{
    background:#E6F7ED;
    color:#168653;
}

.red{
    background:#FDEAEA;
    color:#C63D3D;
}


/* =========================
   COMPARE CHECKBOX
========================= */

.compare-box{
    display:flex;
    align-items:center;
    gap:8px;

    margin-top:15px;

    padding-top:12px;

    border-top:
        1px solid var(--border);

    font-size:13px;

    font-weight:600;

    color:var(--navy);
}

.compare-box input{
    width:auto;

    accent-color:var(--navy);

    cursor:pointer;
}

.compare-bar{
    position:sticky;

    bottom:15px;

    z-index:50;

    margin-top:25px;

    background:
        rgba(7,90,97,.96);

    color:white;

    border-radius:18px;

    padding:15px 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    box-shadow:
        0 12px 35px rgba(7,90,97,.25);
}

.compare-bar span{
    color:#DDF1F2;
    font-size:14px;
}

.compare-table-wrapper{
    overflow-x:auto;
}

.compare-table{
    width:100%;

    border-collapse:collapse;

    min-width:650px;
}

.compare-table th,
.compare-table td{
    padding:14px;

    border:
        1px solid var(--border);

    text-align:left;

    vertical-align:top;
}

.compare-table th{
    background:#EAF4F4;
    color:var(--navy2);
}

.compare-table td{
    background:white;
}


/* =========================
   SUITABILITY
========================= */

.suitability-box{
    padding:14px;

    border-radius:14px;

    margin-top:15px;
}

.suitability-good{
    background:#E6F7ED;
    color:#168653;
    border:1px solid #B9E8CD;
}

.suitability-warning{
    background:#FFF5DF;
    color:#9A6810;
    border:1px solid #F1D79B;
}

.suitability-bad{
    background:#FDEAEA;
    color:#C63D3D;
    border:1px solid #EFB CBC;
}

.suitability-unknown{
    background:#EEF4F4;
    color:#596F72;
    border:1px solid #D9E5E6;
}


/* =========================
   PROFILE
========================= */

label{
    display:block;

    font-weight:600;

    margin:15px 0 6px;
}

input,
select,
textarea{
    width:100%;

    padding:12px 13px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:white;

    color:var(--text);

    outline:none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--blue);

    box-shadow:
        0 0 0 3px rgba(63,159,168,.12);
}

.chips{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.chip{
    border:
        1px solid var(--border);

    background:white;

    color:var(--text);

    padding:8px 13px;

    border-radius:20px;

    font-size:13px;

    cursor:pointer;

    transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
}

.chip:hover{
    border-color:var(--blue);
}

.chip.selected{
    background:var(--navy);

    color:white;

    border-color:var(--navy);
}


/* =========================
   PRODUCT DETAILS
========================= */

.detail-img{
    height:350px;

    border-radius:20px;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(185,221,224,.75),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #E4F1F2,
            #FAFCFC
        );

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:120px;

    border:
        1px solid rgba(7,90,97,.08);
}

.match{
    font-size:30px;

    font-weight:bold;

    color:var(--navy);
}

ul{
    padding-left:20px;
}

li{
    margin-bottom:8px;
    color:var(--muted);
}


/* =========================
   MOBILE BOTTOM NAV
========================= */

.bottomnav{
    display:none;
}

@media(max-width:700px){

    .bottomnav{
        position:fixed;

        bottom:0;
        left:0;
        right:0;

        z-index:100;

        background:
            rgba(255,255,255,.94);

        backdrop-filter:blur(15px);

        border-top:
            1px solid rgba(7,90,97,.10);

        padding:9px;

        display:flex;

        justify-content:space-around;
    }

    .bottomnav button{
        border:0;

        background:none;

        font-size:12px;

        color:var(--muted);
    }

    body{
        padding-bottom:65px;
    }

    .compare-bar{
        bottom:75px;

        flex-direction:column;

        align-items:stretch;
    }

    .hero{
        padding:75px 0 55px;
    }

    .hero::before{
        width:450px;
        height:300px;
    }
}

</style>
</head>

/* =========================================================
   PRODUCT SUITABILITY
========================================================= */

function evaluateProduct(product){

    if(!profile){

        return {
            status:"unknown",
            title:"Profile not available",
            reasons:[
                "Create your PICKSY profile to check suitability.",
                "PICKSY can then compare the product with your allergies, health concerns and budget."
            ]
        };

    }

    const reasons=[];
    let seriousIssue=false;
    let warning=false;

    const productAllergens=
        (product.allergens||[])
        .map(x=>x.toLowerCase());

    const productIngredients=
        (product.ingredients||[])
        .map(x=>x.toLowerCase());

    const userAllergies=
        (profile.allergies||[])
        .map(x=>x.toLowerCase());

    userAllergies.forEach(allergy=>{

        const allergyFound=
            productAllergens.some(a=>
                a.includes(allergy) ||
                allergy.includes(a)
            ) ||
            productIngredients.some(i=>
                i.includes(allergy) ||
                allergy.includes(i)
            );

        if(allergyFound){

            seriousIssue=true;

            reasons.push(
                `Possible match with your listed allergy/avoidance: ${allergy}.`
            );
        }

    });


    if(profile.budget && product.price){

        if(product.price > profile.budget){

            warning=true;

            reasons.push(
                `Price ₹${product.price} is above your saved budget of ₹${profile.budget}.`
            );

        }
        else{

            reasons.push(
                `Price ₹${product.price} is within your saved budget of ₹${profile.budget}.`
            );

        }

    }


    if(profile.diseases && profile.diseases.length){

        reasons.push(
            `Your profile includes: ${profile.diseases.join(", ")}. Check the current nutrition/ingredient label for compatibility.`
        );

    }


    if(
        profile.favourites &&
        profile.favourites.some(
            f=>f.toLowerCase()===route.item.toLowerCase()
        )
    ){

        reasons.push(
            "This product type is listed among your favourites."
        );

    }


    if(seriousIssue){

        return {
            status:"bad",
            title:"May not suit your profile",
            reasons
        };

    }

    if(warning){

        return {
            status:"warning",
            title:"Review before buying",
            reasons
        };

    }

    return {
        status:"good",
        title:"Looks suitable based on your profile",
        reasons:
            reasons.length
            ? reasons
            : [
                "No conflict was identified from the information currently stored in your profile."
            ]
    };

}


/* =========================================================
   SUITABILITY HTML
========================================================= */

function suitabilityHTML(product){

    const result=evaluateProduct(product);

    let className="suitability-unknown";

    if(result.status==="good"){
        className="suitability-good";
    }

    else if(result.status==="warning"){
        className="suitability-warning";
    }

    else if(result.status==="bad"){
        className="suitability-bad";
    }

    return `

        <div class="suitability-box ${className}">

            <strong>
                ${result.title}
            </strong>

            <ul style="margin-top:8px">

                ${result.reasons.map(reason=>`

                    <li>
                        ${reason}
                    </li>

                `).join("")}

            </ul>

        </div>

    `;

}

/* =========================================================
   COMPARE SELECTION
========================================================= */

function toggleCompare(index,item,brand){

    let products=PRODUCTS[item] || [];

    if(brand){

        products=products.filter(
            p=>p.brand===brand
        );

    }

    if(products.length===0){

        products=[

            {
                name:`${brand} ${item}`,
                brand:brand,
                price:199,
                rating:4.3,
                description:
                    `${brand} ${item} product.`,
                ingredients:["See package label"],
                allergens:[]
            },

            {
                name:`${brand} ${item} Premium`,
                brand:brand,
                price:299,
                rating:4.4,
                description:
                    `A premium ${item} option from ${brand}.`,
                ingredients:["See package label"],
                allergens:[]
            }

        ];

    }

    const product=products[index];

    if(!product){
        return;
    }

    const key=createProductKey(item,product,index);

    const existing=
        compareSelection.findIndex(
            x=>x.key===key
        );

    if(existing>=0){

        compareSelection.splice(existing,1);

    }

    else{

        const differentItem=
            compareSelection.find(
                x=>x.item!==item
            );

        if(differentItem){

            alert(
                "You can compare products only from the same item."
            );

            render();

            return;
        }

        compareSelection.push({

            key:key,
            item:item,
            category:route.category,
            brand:product.brand,
            product:product

        });

    }

    render();

}

/* =========================================================
   COMPARISON SUITABILITY
========================================================= */

function comparisonSuitability(product){

    const result=evaluateProduct(product);

    let className="suitability-unknown";

    if(result.status==="good"){
        className="suitability-good";
    }

    else if(result.status==="warning"){
        className="suitability-warning";
    }

    else if(result.status==="bad"){
        className="suitability-bad";
    }

    return `

        <div class="suitability-box ${className}"
             style="margin-top:0">

            <strong>
                ${result.title}
            </strong>

            <ul style="margin-top:8px">

                ${result.reasons.map(reason=>`

                    <li>
                        ${reason}
                    </li>

                `).join("")}

            </ul>

        </div>

    `;

}

/* =========================================================
   START COMPARISON FROM PRODUCT PAGE
========================================================= */

function startCompareFromProduct(){

    let products=PRODUCTS[route.item] || [];

    if(products.length===0){

        alert(
            "Comparison data for this item is not available yet."
        );

        return;
    }

    const currentProduct=
        products.find(
            p=>p.name===decodeURIComponent(route.productName||"")
        );

    if(currentProduct){

        const key=createProductKey(
            route.item,
            currentProduct,
            products.indexOf(currentProduct)
        );

        if(
            !compareSelection.some(
                x=>x.key===key
            )
        ){

            compareSelection.push({

                key:key,
                item:route.item,
                category:route.category,
                brand:currentProduct.brand,
                product:currentProduct

            });

        }

    }

    go("products",{
        category:route.category,
        item:route.item
    });

}

};

if(loadedProfile){

        diseases:
            loadedProfile.diseases || [],

        favourites:

    };

}


function toggleProfile(field,value,element){

    if(!tempProfile[field]){
        tempProfile[field]=[];
    }

    const index=tempProfile[field].indexOf(value);

    if(index>=0){
        tempProfile[field].splice(index,1);
        element.classList.remove("selected");
    }

    else{

        tempProfile[field].push(value);
        element.classList.add("selected");

    }

}


function profileChips(field){

    return PROFILE_OPTIONS[field].map(option=>`

        <button
            type="button"
            class="chip ${
                tempProfile[field].includes(option)
                ?"selected":""
            }"
            onclick="toggleProfile(
                '${field}',
                '${option}',
                this
            )">

            ${option}

        </button>

    `).join("");
}

function saveProfile(){

            )||500,

        lifestyle:
            [...tempProfile.lifestyle],

        allergies:
            [...tempProfile.allergies],

        diseases:
            [...tempProfile.diseases],

        favourites:
            [...tempProfile.favourites],

        likedProducts:
            document.getElementById("likedProducts").value,

        sustainability:
            document.getElementById("sustainability").value,

        priority:
            document.getElementById("priority").value

    sessionStorage.setItem(
        "picksY_profile",
