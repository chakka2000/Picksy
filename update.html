/* =========================================================
   BASIC RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#07152f;
    --navy2:#0d2855;
    --blue:#285ee8;
    --blue2:#4d8cff;
    --white:#ffffff;
    --text:#12203d;
    --muted:#64718a;
    --border:#e5e9f2;
    --green:#168653;
    --red:#c63d3d;
    --orange:#c87916;
    --shadow:0 10px 35px rgba(7,21,47,.12);
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(77,140,255,.35),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(43,93,220,.35),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #06142e,
            #0c2856,
            #142f68,
            #07152f
        );

    background-size:300% 300%;
    animation:gradientMove 14s ease infinite;

    min-height:100vh;
}

@keyframes gradientMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   STARTUP POPUP
========================================================= */

.startup{

    position:fixed;
    inset:0;

    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:

        radial-gradient(
            circle at 20% 20%,
            #285ee855,
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            #4d8cff44,
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #030b1d,
            #0a1e43,
            #06152f
        );

    animation:startupFade 3.2s forwards;
}

.startup-box{

    text-align:center;

    color:white;

    animation:logoReveal 1.8s ease;

}

.startup-box h1{

    font-family:Georgia,serif;

    font-size:clamp(
        55px,
        12vw,
        110px
    );

    letter-spacing:12px;

    margin-bottom:10px;

    text-shadow:
        0 0 35px #4d8cff88;

}

.startup-box p{

    color:#cbd9ff;

    letter-spacing:4px;

    font-size:14px;

}

.startup-line{

    width:80px;

    height:3px;

    background:#5d95ff;

    margin:25px auto;

    border-radius:10px;

}

@keyframes logoReveal{

    from{

        opacity:0;

        transform:scale(.7);

        filter:blur(12px);

    }

    to{

        opacity:1;

        transform:scale(1);

        filter:blur(0);

    }

}

@keyframes startupFade{

    0%,80%{

        opacity:1;

        visibility:visible;

    }

    100%{

        opacity:0;

        visibility:hidden;

    }

}


/* =========================================================
   NAVBAR
========================================================= */

.topbar{

    position:sticky;

    top:0;

    z-index:100;

    background:rgba(
        255,
        255,
        255,
        .94
    );

    backdrop-filter:blur(15px);

    border-bottom:
        1px solid var(--border);

}

.topbar-inner{

    max-width:1150px;

    margin:auto;

    padding:14px 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.logo{

    font-family:Georgia,serif;

    font-size:22px;

    font-weight:bold;

    color:var(--navy);

    letter-spacing:2px;

}

.navlinks{

    display:flex;

    gap:22px;

}

.navlinks button{

    background:none;

    border:0;

    color:#53617a;

    font-size:14px;

}

.navlinks button:hover{

    color:var(--blue);

}

@media(max-width:700px){

    .navlinks{

        display:none;

    }

}


/* =========================================================
   APP
========================================================= */

#app{

    max-width:1150px;

    margin:auto;

    padding:0 20px;

}

.section{

    padding:55px 0;

}

.card{

    background:
        rgba(255,255,255,.97);

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:22px;

    box-shadow:var(--shadow);

}

.grid{

    display:grid;

    gap:18px;

}

.g2{

    grid-template-columns:
        repeat(2,1fr);

}

.g3{

    grid-template-columns:
        repeat(3,1fr);

}

.g4{

    grid-template-columns:
        repeat(4,1fr);

}

@media(max-width:850px){

    .g3,
    .g4{

        grid-template-columns:
            repeat(2,1fr);

    }

}

@media(max-width:600px){

    .g2,
    .g3,
    .g4{

        grid-template-columns:1fr;

    }

}


/* =========================================================
   TEXT
========================================================= */

h1,
h2,
h3,
h4{

    font-family:Georgia,serif;

    color:var(--navy);

}

h1{

    font-size:
        clamp(
            32px,
            6vw,
            54px
        );

}

h2{

    font-size:34px;

    margin-bottom:10px;

}

h3{

    margin-bottom:8px;

}

p{

    color:var(--muted);

    line-height:1.6;

    margin-bottom:10px;

}


/* =========================================================
   BUTTONS
========================================================= */

.btn{

    border:0;

    border-radius:12px;

    padding:11px 18px;

    font-weight:600;

    font-size:14px;

    transition:.2s;

}

.primary{

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue2)
        );

    color:white;

}

.secondary{

    background:white;

    border:
        1px solid var(--border);

    color:var(--navy);

}

.btn:hover{

    transform:
        translateY(-1px);

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn{

    display:inline-flex;

    align-items:center;

    gap:7px;

    border:0;

    background:transparent;

    color:var(--blue);

    font-weight:600;

    margin-bottom:22px;

    padding:5px 0;

}


/* =========================================================
   HOME
========================================================= */

.hero{

    text-align:center;

    padding:90px 0 60px;

    color:white;

}

.hero h1{

    color:white;

}

.hero p{

    color:#d5e1ff;

    max-width:650px;

    margin:15px auto 25px;

    font-size:17px;

}

.hero-buttons{

    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;

}

.category-card{

    text-align:center;

    cursor:pointer;

    transition:.25s;

}

.category-card:hover{

    transform:
        translateY(-6px);

}

.category-icon{

    font-size:48px;

    margin-bottom:12px;

}


/* =========================================================
   ITEM CARDS
========================================================= */

.item-card{

    cursor:pointer;

    transition:.25s;

    text-align:center;

}

.item-card:hover{

    transform:

}

.item-icon{

    font-size:42px;

    margin-bottom:10px;

}


/* =========================================================
   BRAND CARDS
========================================================= */

.brand-card{

    cursor:pointer;

    transition:.25s;

}

.brand-card:hover{

    transform:
        translateY(-5px);

    border-color:#8aaaff;

}

.brand-circle{

    width:60px;

    height:60px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #173b82,
            #4d8cff
        );

    margin-bottom:12px;

}


/* =========================================================
   PRODUCT CARDS
========================================================= */

.product-card{

    cursor:pointer;

    transition:.25s;

}

.product-card:hover{

    transform:
        translateY(-5px);

}

    height:170px;

        linear-gradient(

            #e8efff,
            #f7f9ff

    align-items:center;

    justify-content:center;

    font-size:65px;

    margin-bottom:15px;

}

.price{

    font-weight:bold;

    color:var(--navy);

}

.pill{

    font-size:12px;

    font-weight:600;

    margin-top:8px;

.blue{

.green{

}

.red{

    color:#c63d3d;

}

.orange{

    background:#fff1dc;

    color:#b86b0b;

/* =========================================================
   PROFILE
========================================================= */

label{

    font-weight:600;

    margin:15px 0 6px;

input,
select,
textarea{

    background:white;

    color:var(--text);

.chips{

    font-size:13px;

    cursor:pointer;

}

.chip.selected{

    color:white;

    border-color:var(--blue);

}

========================================================= */

    font-weight:bold;

    color:var(--green);

}

ul{

    padding-left:20px;

}

li{

    margin-bottom:8px;

    color:var(--muted);

}


/* =========================================================
   SUITABILITY BOX
========================================================= */

.suitability-box{

    margin-top:18px;

    padding:18px;

    border-radius:15px;

    background:#f8faff;

    border:1px solid var(--border);

}

.suitability-box.suitable{

    border-left:
        5px solid var(--green);

    background:#f1fbf5;

}

.suitability-box.warning{

    border-left:
        5px solid var(--red);

    background:#fff5f5;

}

.suitability-box.check{

    border-left:
        5px solid var(--blue);

    background:#f3f7ff;

}

.suitability-title{

    font-size:20px;

    font-weight:bold;

    margin-top:8px;

    color:var(--navy);

}

.profile-summary{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-top:15px;

}

.profile-summary-item{

    background:#f7f9ff;

    padding:14px;

    border-radius:12px;

}

.profile-summary-item strong{

    display:block;

    margin-bottom:5px;

}

@media(max-width:600px){

    .profile-summary{

        grid-template-columns:1fr;

    }

/* =========================================================
   MOBILE BOTTOM NAV
========================================================= */

.bottomnav{

    display:none;

}

@media(max-width:700px){

        position:fixed;

        bottom:0;

        padding:9px;

        display:flex;

    }

    .bottomnav button{

        border:0;

        background:none;

        font-size:12px;

        color:var(--muted);

    }

    body{

        padding-bottom:65px;

    }

/* =========================================================
   PROFILE SUITABILITY
========================================================= */

function checkProductSuitability(product){

    const info=
        getProductInfo(product);


    if(!profile){

        return {

            status:"check",

            title:"Create your profile",

            message:
                "Create your PICKSY profile to see whether this product matches your preferences.",

            reasons:[

                "Add your allergies.",

                "Add relevant health concerns.",

                "Add your budget.",

                "Add your favourite products and preferences."

            ],

            positives:[]

        };

    }


    let warnings=[];

    let positives=[];


    /* -------------------------------------------------------
       ALLERGY CHECK
    ------------------------------------------------------- */

    const userAllergies=
        (profile.allergies || [])
        .map(
            x=>x.toLowerCase()
        );


    const productAllergens=
        (info.allergens || [])
        .map(
            x=>x.toLowerCase()
        );


    userAllergies.forEach(allergy=>{

        if(allergy==="other"){
            return;
        }

        const match=
            productAllergens.some(
                allergen=>{

                    return allergen.includes(allergy) ||
                           allergy.includes(allergen);

                }
            );


        if(match){

            warnings.push(

                `Your profile lists ${allergy} as something to avoid.`

            );

        }

    });


    /* -------------------------------------------------------
       BUDGET
    ------------------------------------------------------- */

    if(
        profile.budget &&
        product.price >
        Number(profile.budget)
    ){

        warnings.push(

            `The price ₹${product.price} is above your saved budget of ₹${profile.budget}.`

        );

    }

    else if(
        profile.budget &&
        product.price <=
        Number(profile.budget)
    ){

        positives.push(

            `The price ₹${product.price} is within your saved budget.`

        );

    }


    /* -------------------------------------------------------
       LIFESTYLE
    ------------------------------------------------------- */

    const lifestyle=
        (profile.lifestyle || [])
        .map(
            x=>x.toLowerCase()
        );


    if(
        lifestyle.includes(
            "health-conscious"
        ) &&
        info.healthNotes &&
        info.healthNotes.length
    ){

        positives.push(

            "This product has characteristics that may align with your health-conscious preference."

        );

    }


    if(
        lifestyle.includes(
            "budget-focused"
        ) &&
        profile.budget &&
        product.price <=
        Number(profile.budget)
    ){

        positives.push(

            "This product fits your budget-focused preference."

        );

    }


    /* -------------------------------------------------------
       FAVOURITES
    ------------------------------------------------------- */

    const favourites=
        (profile.favourites || [])
        .map(
            x=>x.toLowerCase()
        );


    const itemName=
        (route.item || "")
        .toLowerCase();


    const favouriteMatch=
        favourites.some(
            favourite=>{

                return itemName.includes(favourite) ||
                       favourite.includes(itemName);

            }
        );


    if(favouriteMatch){

        positives.push(

            "This product type is one of your saved favourites."

        );

    }


    /* -------------------------------------------------------
       PREVIOUSLY LIKED
    ------------------------------------------------------- */

    const liked=
        (
            profile.likedProducts ||
            ""
        ).toLowerCase();


    if(
        liked &&
        (
            liked.includes(
                product.brand.toLowerCase()
            ) ||
            liked.includes(itemName)
        )
    ){

        positives.push(

            "This brand or product type appears in your previously liked products."

        );

    }


    /* -------------------------------------------------------
       RESULT
    ------------------------------------------------------- */

    if(warnings.length){

        return {

            status:"not-suitable",

            title:
                "May not suit your profile",

            message:
                "PICKSY found one or more things that may conflict with your saved preferences.",

            reasons:warnings,

            positives:positives

        };

    }


    if(positives.length){

        return {

            status:"suitable",

            title:
                "Looks suitable for your profile",

            message:
                "Based on the information currently saved in your PICKSY profile, this product appears to match your preferences.",

            reasons:positives,

            positives:[]

        };

    }


    return {

        status:"check",

        title:
            "Check before buying",

        message:
            "PICKSY does not have enough product-specific information to determine a strong profile match.",

        reasons:[

            "Check the current ingredient list.",

            "Check allergy warnings on the package.",

            "Check the current price.",

            "Consider your personal requirements before purchasing."

        ],

        positives:[]

    };

}


/* =========================================================
   SUITABILITY HTML
========================================================= */

function suitabilityHTML(product){

    const result=
        checkProductSuitability(product);


    let boxClass="check";

    let pillClass="blue";

    let pillText=
        "ⓘ Check Before Buying";


    if(result.status==="suitable"){

        boxClass="suitable";

        pillClass="green";

        pillText="✓ Suitable";

    }


    if(result.status==="not-suitable"){

        boxClass="warning";

        pillClass="red";

        pillText="⚠ May Not Suit";

    }


    return `

        <div
            class="suitability-box ${boxClass}">


            <span
                class="pill ${pillClass}">

                ${pillText}

            </span>


            <div
                class="suitability-title">

                ${result.title}

            </div>


            <p>
                ${result.message}
            </p>


            <ul>

                ${
                    result.reasons
                    .map(
                        reason=>`

                        <li>
                            ${reason}
                        </li>

                        `
                    )
                    .join("")
                }

            </ul>

        </div>

    `;

}

/* =========================================================
   PROFILE CHIPS
========================================================= */

function toggleProfile(
    field,
    value,
    element
){

    if(!tempProfile[field]){

        tempProfile[field]=[];

    }


    const index=
        tempProfile[field].indexOf(
            value
        );


    if(index>=0){

        tempProfile[field].splice(
            index,
            1
        );

        element.classList.remove(
            "selected"
        );

    }

    else{

        tempProfile[field].push(
            value
        );

        element.classList.add(
            "selected"
        );

    }

}


function profileChips(field){

    return PROFILE_OPTIONS[field]
        .map(option=>`

        <button
            type="button"
            class="chip ${
                tempProfile[field]
                .includes(option)
                ?"selected"
                :""
            }"
            onclick="toggleProfile(
                '${field}',
                '${option}',
                this
            )">

            ${option}

        </button>

    `).join("");

}

function saveProfile(){

                    "profileBudget"
                ).value

            [...tempProfile.lifestyle],


        allergies:
            [...tempProfile.allergies],


        diseases:
            [...tempProfile.diseases],


        favourites:
            [...tempProfile.favourites],


        likedProducts:
            document.getElementById(
                "likedProducts"
            ).value,


        sustainability:
            document.getElementById(
                "sustainability"
            ).value,


        priority:
            document.getElementById(
                "priority"
            ).value

    };


    sessionStorage.setItem(

        "picksY_profile",

        JSON.stringify(profile)

    );


    alert(
        "Your PICKSY profile has been saved!"
    );


    go("home");

}

            content=
                pageProducts();

            break;


        case "product":

            content=
                pageProduct();

            break;


        case "profile":

            content=
                pageProfile();

            break;


        case "saved":

            content=
                pageSaved();

            break;

            content=
