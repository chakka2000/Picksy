@keyframes startupGradient{

}

.startup-content{

  animation:startupIn 1.2s ease;

.startup-name{

.startup-line{

.startup-sub{

  letter-spacing:3px;
  font-size:12px;
  text-transform:uppercase;
}

@keyframes startupIn{
  from{
    opacity:0;
    transform:scale(.9);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.startup.hide{
  animation:startupOut .7s ease forwards;
}

@keyframes startupOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}

/* FLOATING DECORATION */

  right:-80px;

  animation-delay:-5s;
}

@keyframes floatOrb{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(40px,-30px)}

 {

const CATEGORIES = [

/* =========================================================
   STATE
========================================================= */

let profile =
  JSON.parse(sessionStorage.getItem("picky_profile") || "null") ||
  null;

let saved = new Set();

let compareSet = new Set();

let route = {
  page:"home"
};

let previousPages = [];


/* =========================================================
   PROFILE DEMO
========================================================= */

const DEMO_PROFILE = {

 name:"Aisha",

 budget:600,

 lifestyle:[
  "Sensitive skin",
  "Eco-conscious",
  "Active"
 ],

 avoid:[
  "fragrance",
  "parabens",

 diseases:[

 allergies:[

 ],

 favourites:[

 ],

 likedProducts:[

 ],

 sustainability:"high",

 brandsLike:[

 ],

 brandsAvoid:[

 ],

 priority:"Health & Ingredient safety"
};


/* =========================================================
   SAVE PROFILE
========================================================= */

function saveProfile(){

 try{
  sessionStorage.setItem(
   "picky_profile",
   JSON.stringify(profile)
  );
 }catch(e){}

}


/* =========================================================
   MATCH ENGINE
========================================================= */

function computeMatch(p,prof){

 if(!prof) return null;

 let score = 50;

 let reasons = [];

 let concerns = [];

 let verify = [];


 /* BUDGET */

 if(p.price <= prof.budget){

  score += 15;

  reasons.push(
   "Within your budget of ₹"+prof.budget
  );

 }else if(p.price <= prof.budget * 1.3){

  score -= 5;

  concerns.push(
   "Slightly above your preferred budget"
  );

 }else{

  score -= 15;

  concerns.push(
   "Well above your preferred budget"
  );

 }


 /* AVOID INGREDIENTS */

 const hits =
  p.attrs.avoid.filter(
   a =>
   prof.avoid.some(
    pa =>
    a.toLowerCase().includes(pa.toLowerCase()) ||
    pa.toLowerCase().includes(a.toLowerCase())
   )
  );

 if(hits.length){

  score -= 20 * hits.length;

  concerns.push(
   "Contains "+hits.join(", ")+" from your avoid list"
  );

 }else{

  score += 10;

  reasons.push(
   "No known ingredients from your avoid list"
  );

 }


 /* ALLERGIES */

 if(prof.allergies && prof.allergies.length){

  const allergyHit =
   p.attrs.ingredients.some(
    ingredient =>
    prof.allergies.some(
     allergy =>
     ingredient.toLowerCase().includes(
      allergy.toLowerCase().split(" ")[0]
     )
    )
   );

  if(allergyHit){

   score -= 25;

   concerns.push(
    "Possible allergy-related concern — verify the label carefully"
   );

  }

 }


 /* DISEASE / HEALTH PROFILE */

 if(prof.diseases && prof.diseases.length){

  if(
   !prof.diseases.includes("None") &&
   p.cat === "Grocery"
  ){

   concerns.push(
    "Because you listed a health condition, verify suitability with a qualified professional"
   );

   score -= 5;
  }

 }


 /* SUSTAINABILITY */

 if(prof.sustainability === "high"){

  if(p.attrs.sustainablePackaging){

   score += 15;

   reasons.push(
    "Sustainable packaging matches your preference"
   );

  }else{

   score -= 10;

   concerns.push(
    "Packaging is not marked sustainable"
   );

  }

 }


 /* BRAND PREFERENCE */

 if(prof.brandsLike.includes(p.brand)){

  score += 10;

  reasons.push(
   "From "+BRANDS[p.brand].name+
   ", a brand you prefer"
  );

 }

 if(prof.brandsAvoid.includes(p.brand)){

  score -= 15;

  concerns.push(
   "From a brand you prefer to avoid"
  );

 }


 /* FAVOURITES */

 if(prof.favourites){

  const favHit =
   prof.favourites.some(
    f =>
    p.name.toLowerCase().includes(
     f.toLowerCase()
    ) ||
    p.cat.toLowerCase().includes(
     f.toLowerCase()
    )
   );

  if(favHit){

   score += 8;

   reasons.push(
    "Matches one of your favourite product types"
   );

  }

 }


 /* PREVIOUS LIKED PRODUCTS */

 if(prof.likedProducts){

  const liked =
   prof.likedProducts.some(
    x =>
    p.name.toLowerCase() ===
    x.toLowerCase()
   );

  if(liked){

   score += 12;

   reasons.push(
    "You previously liked this product"
   );

  }

 }


 score =
  Math.max(
   5,
   Math.min(
    98,
    Math.round(score)
   )
  );


 verify = [

  "Current price at retailer",

  "Latest full ingredient/material list",

  "Allergy and health-related suitability",

  "Certification claims",

  "Stock availability near you"

 ];


 return {
  score,
  reasons,
  concerns,
  verify
 };

}


function ringColor(score){

 if(score >= 75)
  return "var(--green)";

 if(score >= 50)
  return "var(--amber)";

 return "var(--red)";

}


/* =========================================================
   HELPERS
========================================================= */

function el(html){

 const d =
  document.createElement("div");

 d.innerHTML = html;

 return d.firstElementChild;

}


function go(page,params={}){

 if(route.page !== page){

  previousPages.push(
   JSON.parse(JSON.stringify(route))
  );

 }

 route = {
  page,
  ...params
 };

 render();

 window.scrollTo(0,0);

}


function goBack(){

 if(previousPages.length){

  route =
   previousPages.pop();

  render();

  window.scrollTo(0,0);

 }else{

  go("home");

 }

}

   BACK BUTTON
========================================================= */

 if(route.page === "home")

 return `
 <div

/* =========================================================
   PROFILE TOGGLE
========================================================= */

window._draftProfile = null;


function toggleField(field,val,node){

 if(!window._draftProfile){

  window._draftProfile =
   JSON.parse(
    JSON.stringify(
     profile ||
     {
      name:"",
      budget:500,
      lifestyle:[],
      avoid:[],
      materials:[],
      diseases:[],
      allergies:[],
      favourites:[],
      likedProducts:[],
      sustainability:"medium",
      brandsLike:[],
      brandsAvoid:[],
      priority:"Value for money"
     }
    )
   );

 }


 const d =
  window._draftProfile;


 if(field.startsWith("brandsLike_")){

  const key =
   field.split("_")[1];

  toggleArr(
   d.brandsLike,
   key
  );

 }


 else if(field.startsWith("brandsAvoid_")){

  const key =
   field.split("_")[1];

  toggleArr(
   d.brandsAvoid,
   key
  );

 }


 else{

  if(!d[field])
   d[field]=[];

  toggleArr(
   d[field],
   val
  );

 }


 node.classList.toggle("sel");

}


function toggleArr(arr,val){

 const i =
  arr.indexOf(val);

 if(i>=0)
  arr.splice(i,1);
 else
  arr.push(val);

}

       font-size:14px;
       color:var(--muted);">

      ${
       m.verify
       .map(r=>`<li>${r}</li>`)
       .join("")
      }

     </ul>

    </div>

   </div>

   `
   :
   `
   <div
    class="card"
    style="margin-top:20px;">

    <p>
     <a
      href="#"
      onclick="
       go('profile');
       return false;
      ">

      Build your profile

     </a>

     to see your personalized match.
    </p>

   </div>
   `
  }


  <div
   class="card"
   style="margin-top:16px;">

   <h4>
    Ingredients / Materials
   </h4>

   <div>

    ${
     p.attrs.ingredients
     .map(
      i =>
      `
      <span
       class="pill pill-blue"
       style="margin:3px 6px 0 0;">

       ${i}

      </span>
      `
     )
     .join("")
    }

   </div>

  </div>


  <h3 style="margin-top:26px;">
   Alternatives
  </h3>


  <div class="grid g3">

   ${
    alternatives
    .map(prodCard)
    .join("")
   }

  </div>


  ${
   cheaper
   ?
   `
   <div
    class="card"
    style="margin-top:16px;">

    <h4>
     Lower-price alternative
    </h4>

    <p>
     ${cheaper.name} is available
     at ₹${cheaper.price}.
    </p>

   </div>
   `
   :
   ""
  }


  <div class="footer-note">

   PICKSY recommendations are based on
   information you provide and product data
   available in this demo. They are not
   medical advice. Always check the current
   product label and consult a qualified
   professional for health-related concerns.

  </div>

 </div>

 `;

}


/* =========================================================
   BRAND
========================================================= */

  BRANDS[route.id];


 if(!b)

   <div class="section">
    <p>Brand not found.</p>
   </div>
  `;


 const items =
  PRODUCTS.filter(
   p=>p.brand===route.id
  );


 return `

 ${backButton()}

 <div class="section">

  <h2>
   ${b.name}
  </h2>

  <p>
   ${b.desc}
  </p>


  <div style="margin-bottom:16px;">

   <span class="pill pill-blue">
    ${b.cat}
   </span>

   <span class="pill pill-blue">
    ${b.price}
   </span>

   ${
    b.sustainable

    `<span class="pill pill-green">

    </span>`

  </div>


  <h3>
   Products from ${b.name}
  </h3>


  <div class="grid g3">

    .map(prodCard)

  </div>

/* =========================================================
   SAVED
========================================================= */

function pageSaved(){

 const items =
  PRODUCTS.filter(
   p=>saved.has(p.id)
  );


 return `

 ${backButton()}

 <div class="section">

  <h2>
   Saved Products
  </h2>


  ${
   items.length
   ?
   `
   <div class="grid g3">
    ${items.map(prodCard).join("")}
   </div>
   `
   :
   `
   <p>
    You haven't saved any products yet.
   </p>
   `
  }


  ${
   compareSet.size>0
   ?
   `
   <div style="margin-top:24px;">

    <button
     class="btn btn-primary"
     onclick="go('compare')">

     Compare Selected
     (${compareSet.size})

    </button>

   </div>
   `
   :
   ""
  }

 </div>

 `;

}


/* =========================================================
   COMPARE
========================================================= */

function pageCompare(){

 const items =
  PRODUCTS.filter(
   p=>compareSet.has(p.id)
  );


 if(items.length<2){

  return `

   ${backButton()}

   <div class="section">

    <h2>
     Compare Products
    </h2>

    <p>
     Select at least 2 products
     to compare them.
    </p>

   </div>

  `;

 }


 const rows=[

  [
   "Brand",
   p=>BRANDS[p.brand].name
  ],

  [
   "Price",
   p=>"₹"+p.price
  ],

  [
   "Category",
   p=>p.cat
  ],

  [
   "Match Score",
   p=>{
    const m =
     computeMatch(p,profile);

    return m
     ? m.score+"%"
     : "Build profile";
   }
  ],

  [
   "Sustainable packaging",
   p=>p.attrs.sustainablePackaging
    ?"Yes"
    :"No"
  ],

  [
   "Ingredients / Materials",
   p=>p.attrs.ingredients.join(", ")
  ],

  [
   "Rating",
   p=>p.rating+" / 5"
  ]

 ];


 return `

 ${backButton()}

 <div class="section">

  <h2>
   Compare Products
  </h2>


  <div class="scrollx">

   <table>

    <tr>

     <th></th>

     ${
      items
      .map(
       p=>
       `<th>${p.name}</th>`
      )
      .join("")
     }

    </tr>


    ${
     rows
     .map(
      ([label,fn])=>
      `
      <tr>

       <th>
        ${label}
       </th>

       ${
        items
        .map(
         p=>
         `<td>${fn(p)}</td>`
        )
        .join("")
       }

      </tr>
      `
     )
     .join("")
    }

   </table>

  </div>

 </div>

 `;

}


/* =========================================================
   AI
========================================================= */

function pageAI(){

 return `

 ${backButton()}

 <div class="section">

  <h2>
   Ask Before You Buy
  </h2>

  <p>
   Ask questions using your profile
   and the product data.
  </p>


  <div class="card">

   <div
    class="msgbox"
    id="msgbox">

    <div class="msg ai">

     Hi${profile?" "+profile.name:""}!
     Ask me about a product you've viewed.

    </div>

   </div>


   <div
    style="
     display:flex;
     gap:8px;
     margin-top:12px;">

    <input
     id="aiinput"
     placeholder="Ask a question..."
     onkeydown="
      if(event.key==='Enter')
       sendAI()
     ">

    <button
     class="btn btn-primary"
     onclick="sendAI()">

     Ask

    </button>

   </div>


   <div style="margin-top:10px;">

    ${
     [
      "Why does this match me?",
      "What are cheaper alternatives?",
      "What should I check before buying?",
      "Does this fit my allergies?"
     ]
     .map(
      q=>
      `
      <span
       class="chip"
       onclick="
        document.getElementById('aiinput').value='${q}';
        sendAI();
       ">

       ${q}

      </span>
      `
     )
     .join("")
    }

   </div>

  </div>

 </div>

 `;

}


/* =========================================================
   AI RESPONSE
========================================================= */

window._lastProductId=null;


function sendAI(){

 const inp =
  document.getElementById("aiinput");


 const q =
  inp.value.trim();


 if(!q)
  return;


 const box =
  document.getElementById("msgbox");


 box.appendChild(
  el(
   `<div class="msg user">${q}</div>`
  )
 );


 inp.value="";


 const p =
  window._lastProductId
  ?
  PRODUCTS.find(
   x=>x.id===window._lastProductId
  )
  :
  null;


 let reply;


 if(!p){

  reply =
   "Open a product page first so I can reference its actual product data.";

 }


 else if(!profile){

  reply =
   "Build your profile first so I can personalize the answer.";

 }


 else{

  const m =
   computeMatch(p,profile);


  const ql =
   q.toLowerCase();


  if(
   ql.includes("why") ||
   ql.includes("match")
  ){

   reply =
    `${p.name} has a ${m.score}% profile match. `+
    (
     m.reasons.length
     ?
     "It matches because: "+
     m.reasons.join("; ")+". "
     :
     ""
    )+
    (
     m.concerns.length
     ?
     "Things to consider: "+
     m.concerns.join("; ")+"."
     :
     ""
    );

  }


  else if(
   ql.includes("cheap")
  ){

   const cheaper =
    PRODUCTS
    .filter(
     x =>
     x.cat===p.cat &&
     x.id!==p.id &&
     x.price<p.price
    )
    .sort(
     (a,b)=>a.price-b.price
    )[0];


   reply =
    cheaper
    ?
    `A cheaper option is ${cheaper.name} at ₹${cheaper.price}.`
    :
    "I don't have a cheaper product in the demo catalog.";

  }


  else if(
   ql.includes("allerg")
  ){

   reply =
    "Check the current full ingredient list carefully against your recorded allergies and sensitivities. If there is uncertainty, consult a qualified professional.";

  }


  else if(
   ql.includes("check") ||
   ql.includes("verify")
  ){

   reply =
    "Before buying, verify: "+
    m.verify.join(", ")+
    ".";

  }


  else{

   reply =
    "I can answer using the product information and your profile, but I won't guess about prices, ingredients, certifications or health effects that aren't in the product data.";

  }

 }


 box.appendChild(
  el(
   `<div class="msg ai">${reply}</div>`
  )
 );


 box.scrollTop =
  box.scrollHeight;

}


/* =========================================================
   SAVE / COMPARE
========================================================= */

function toggleSave(id){

 if(saved.has(id))
  saved.delete(id);
 else
  saved.add(id);

 render();

}


function toggleCompare(id){

 if(compareSet.has(id))
  compareSet.delete(id);
 else
  compareSet.add(id);

 render();

}


/* =========================================================
   ROUTER
========================================================= */

function render(){

 if(route.page==="product")
  window._lastProductId =
   route.id;


 const map={

  home:pageHome,

  profile:pageProfile,

  dashboard:pageDashboard,

  search:pageSearch,

  scan:pageScan,

  product:pageProduct,

  brand:pageBrand,

  saved:pageSaved,

  compare:pageCompare,

  ai:pageAI

 };


 document.getElementById("app").innerHTML =
  (
   map[route.page] ||
   pageHome
  )();


 document
  .querySelectorAll(
   ".navlinks span,.bottomnav button"
  )
  .forEach(n=>{

   const target =
    n.getAttribute("data-nav");

   n.classList.toggle(
    "active",
    target===route.page ||
    (
     target==="home" &&
     route.page==="dashboard"
    )
   );

  });

}


/* =========================================================
   NAVIGATION
========================================================= */

document
 .querySelectorAll("[data-nav]")
 .forEach(n=>{

  n.addEventListener(
   "click",
   ()=>{

    const t =
     n.getAttribute("data-nav");


    if(t==="home"){

     go(
      profile
      ?
      "dashboard"
      :
      "home"
     );

    }else{

     go(t);

    }

   }
  );

 });


/* =========================================================
   STARTUP SCREEN
========================================================= */

window.addEventListener(
 "load",
 ()=>{

  setTimeout(
   ()=>{

    const startup =
     document.getElementById("startup");

    startup.classList.add("hide");

    setTimeout(
     ()=>{
      startup.remove();
     },
     750
    );

   },
   2300
  );

 });


/* =========================================================
   START
========================================================= */

go("home");

</script>
