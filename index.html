:root{
  --navy:#06132f;
  --navy2:#0b1f46;

  --lav:#8296ff;
  --white:#f8faff;

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:80px;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
  color:var(--white);
  background:
    radial-gradient(circle at 15% 20%,rgba(77,124,255,.22),transparent 32%),
    radial-gradient(circle at 85% 15%,rgba(130,150,255,.18),transparent 30%),
    radial-gradient(circle at 70% 85%,rgba(36,87,214,.22),transparent 35%),
    linear-gradient(125deg,#040d22,#0a1b3d,#102a5b,#071633,#0c1d43);
  background-size:180% 180%;
  animation:gradientMove 18s ease-in-out infinite;
  overflow-x:hidden;
}

body::before,
body::after{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(90px);
  pointer-events:none;
  z-index:-1;
}

body::before{
  background:rgba(61,105,255,.18);
  top:-180px;
  left:-160px;
  animation:orbOne 14s ease-in-out infinite alternate;
}

body::after{
  background:rgba(124,139,255,.13);
  right:-180px;
  bottom:-180px;
  animation:orbTwo 17s ease-in-out infinite alternate;
}

@keyframes gradientMove{
  0%,100%{background-position:0% 30%}
  50%{background-position:100% 70%}
}

@keyframes orbOne{
  from{transform:translate(0,0)}
  to{transform:translate(180px,120px)}
}

@keyframes orbTwo{
  from{transform:translate(0,0)}
  to{transform:translate(-150px,-100px)}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden}
}

@keyframes logoFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-7px) scale(1.015)}
}

@keyframes glowPulse{
  0%,100%{opacity:.35;transform:scale(1)}
  50%{opacity:.65;transform:scale(1.12)}
}

h1,h2,h3,h4{
  font-family:Georgia,"Times New Roman",serif;

  margin:0 0 .45em;
}

h1{line-height:1.12}
p{

a{

button,

function computeMatch(p,prof){

  if(!prof) return null;

  let score=50;

  let reasons=[];
  let concerns=[];
  let verify=[];


  /* Budget */

  if(p.price<=prof.budget){

    score+=15;

    reasons.push(
      "Within your budget of ₹"+prof.budget
    );

  }else if(p.price<=prof.budget*1.3){

    score-=5;

    concerns.push(
      "Slightly above your preferred budget (₹"+
      prof.budget+
      ")"
    );

  }else{

    score-=15;

    concerns.push(
      "Well above your preferred budget (₹"+
      prof.budget+
      ")"
    );

  }


  /* Avoid ingredients */

  const hit=p.attrs.avoid.filter(a=>
    prof.avoid.some(pa=>
      a.toLowerCase().includes(
        pa.toLowerCase()
      ) ||
      pa.toLowerCase().includes(
        a.toLowerCase()
      )
    )
  );


  if(hit.length){

    score-=20*hit.length;

    concerns.push(
      "Contains "+
      hit.join(", ")+
      " — on your avoid list"
    );

  }else{

    score+=10;

    reasons.push(
      "Free from ingredients on your avoid list"
    );

  }


  /* Sustainability */

  if(prof.sustainability==="high"){

    if(p.attrs.sustainablePackaging){

      score+=15;

      reasons.push(
        "Uses sustainable packaging, matching your sustainability preference"
      );

    }else{

      score-=10;

      concerns.push(
        "Packaging is not marked sustainable"
      );

    }

  }


  /* Brand preferences */

  if(prof.brandsLike.includes(p.brand)){

    score+=10;

    reasons.push(
      "From "+
      BRANDS[p.brand].name+
      ", a brand you prefer"
    );

  }


  if(prof.brandsAvoid.includes(p.brand)){

    score-=15;

    concerns.push(
      "From "+
      BRANDS[p.brand].name+
      ", a brand you'd rather avoid"
    );

  }


  /* Materials */

  const matMatch=prof.materials.some(m=>
    p.attrs.ingredients.some(i=>
      i.toLowerCase().includes(
        m.toLowerCase().split(" ")[0]
      )
    )
  );


  if(matMatch){

    score+=10;

    reasons.push(
      "Contains material/ingredients you look for"
    );

  }


  score=Math.max(
    5,
    Math.min(
      98,
      Math.round(score)
    )
  );


  verify=[
    "Current price at retailer",
    "Latest full ingredient/material list on packaging",
    "Certification claims",
    "Stock availability near you"
  ];


  return{
    score,
    reasons,
    concerns,
    verify
  };

}


function ringColor(score){

  return score>=75
    ?"var(--green)"
    :score>=50
    ?"var(--amber)"
    :"var(--red)";

}


/* =========================================================
   HELPERS
========================================================= */

function go(page,params={}){

  route={
    page,
    ...params
  };

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function alts(p){

  const cheaper=
    PRODUCTS
      .filter(x=>
        x.cat===p.cat &&
        x.id!==p.id &&
        x.price<p.price
      )
      .sort((a,b)=>a.price-b.price)[0];


  const premium=
    PRODUCTS
      .filter(x=>
        x.cat===p.cat &&
        x.id!==p.id &&
        x.price>p.price
      )
      .sort((a,b)=>a.price-b.price)[0];


  const otherBrand=
    PRODUCTS
      .filter(x=>
        x.cat===p.cat &&
        x.brand!==p.brand &&
        x.id!==p.id
      )[0];


  const stronger=profile
    ?
      PRODUCTS
        .filter(x=>
          x.cat===p.cat &&
          x.id!==p.id
        )
        .map(x=>({
          x,
          m:computeMatch(x,profile)
        }))
        .sort((a,b)=>
          b.m.score-a.m.score
        )[0]
    :null;


  return{
    cheaper,
    premium,
    otherBrand,
    stronger
  };

}

window._draftProfile=null;


function toggleField(field,val,node){

  if(!window._draftProfile){

    window._draftProfile=
      JSON.parse(
        JSON.stringify(
          profile || {

            name:"",
            budget:500,
            lifestyle:[],
            avoid:[],
            materials:[],
            sustainability:"medium",
            brandsLike:[],
            brandsAvoid:[],
            priority:"Value for money"

          }
        )
      );

  }


  const d=window._draftProfile;


  if(field.startsWith("brandsLike_")){

    const key=field.split("_")[1];

    toggleArr(
      d.brandsLike,
      key
    );

  }else if(field.startsWith("brandsAvoid_")){

    const key=field.split("_")[1];

    toggleArr(
      d.brandsAvoid,
      key
    );

  }else{

    toggleArr(
      d[field],
      val
    );

  }


  node.classList.toggle("sel");

}


function toggleArr(arr,val){

  const i=arr.indexOf(val);

  if(i>=0){

    arr.splice(i,1);

  }else{

    arr.push(val);

  }

}


function saveProfileForm(){

  const d=
    window._draftProfile ||
    (
      profile
      ?
      JSON.parse(
        JSON.stringify(profile)
      )
      :
      {
        lifestyle:[],
        avoid:[],
        materials:[],
        brandsLike:[],
        brandsAvoid:[]
      }
    );


  d.name=
    document.getElementById("f_name").value ||
    "You";

  d.budget=
    Number(
      document.getElementById("f_budget").value
    ) || 500;

  d.sustainability=
    document.getElementById("f_sus").value;

  d.priority=
    document.getElementById("f_priority").value;


  profile=d;

  saveProfile();

  window._draftProfile=null;

  go("dashboard");

}

        <div style="margin-top:10px;">

          <button
            class="btn btn-ghost"
            onclick="
              toggleSave('${p.id}')
            "
            id="savebtn"
          >
            ${saved.has(p.id)
              ?"♥ Saved"
              :"♡ Save"}
          </button>


          <button
            class="btn btn-ghost"
            onclick="
              toggleCompare('${p.id}')
            "
            id="comparebtn"
          >
            ${

              ?"✓ Added to Compare"
              :"+ Compare"
            }
          </button>

        </div>

      </div>

    </div>


    ${
      m
      ?

      `

      <div
        class="card"
        style="
          margin-top:20px;
          display:flex;
          gap:20px;
          align-items:center;
          flex-wrap:wrap;
        "
      >

        <div
          class="match-ring"
          style="
            background:${ringColor(m.score)};
          "
        >
          ${m.score}%
        </div>


        <div
          style="
            flex:1;
            min-width:200px;
          "
        >

          <h3 style="margin-bottom:4px;">
            Preference Match
          </h3>

          <p style="margin:0;">
            Based on your profile —
            budget, ingredients,
            sustainability and
            brand preferences.
          </p>

        </div>

      </div>


      <div
        class="grid g3"
        style="margin-top:16px;"
      >

        <div class="card">

          <div class="pill pill-green">
            ✓ Matches Your Preferences
          </div>

          <ul
            style="
              padding-left:18px;
              font-size:14px;
              color:#aebbd7;
            "
          >

            ${
              m.reasons.map(
                r=>`<li>${r}</li>`
              ).join("")
              ||
              "<li>No strong matches found</li>"
            }

          </ul>

        </div>


        <div class="card">

          <div class="pill pill-amber">
            ⚠ Things to Consider
          </div>

          <ul
            style="
              padding-left:18px;
              font-size:14px;
              color:#aebbd7;
            "
          >

            ${
              m.concerns.map(
                r=>`<li>${r}</li>`
              ).join("")
              ||
              "<li>No major concerns found</li>"
            }

          </ul>

        </div>


        <div class="card">

          <div class="pill pill-blue">
            ? Verify Before Buying
          </div>

          <ul
            style="
              padding-left:18px;
              font-size:14px;
              color:#aebbd7;
            "
          >

            ${
              m.verify.map(
                r=>`<li>${r}</li>`
              ).join("")
            }

          </ul>

        </div>

      </div>


      <div
        class="card"
        style="margin-top:16px;"
      >

        <h4>
          Why does this match me?
        </h4>

        <p>

          ${
            m.reasons.length
            ?
            `
            This scores ${m.score}% mainly because:
            ${m.reasons.join("; ")}.
            `
            :""
          }

          ${
            m.concerns.length
            ?
            `
            It's held back by:
            ${m.concerns.join("; ")}.
            `
            :""
          }

        </p>

      </div>

      `

      :

      `

      <div
        class="card"
        style="margin-top:20px;"
      >

        <p>

          <a
            href="#"
            onclick="
              go('profile');
              return false;
            "
          >
            Build your profile
          </a>

          to see a personalized
          match score for this product.

        </p>

      </div>

      `
    }


    <div
      class="card"
      style="margin-top:16px;"
    >

      <h4>
        Ingredients / Materials
      </h4>

      <div>

        ${
          p.attrs.ingredients.map(i=>`

            <span
              class="pill pill-blue"
              style="
                margin:3px 6px 0 0;
              "
            >
              ${i}
            </span>

          `).join("")
        }

      </div>

    </div>


    <h3 style="margin-top:24px;">
      Alternatives
    </h3>


    <div class="grid g2">

      ${
        a.cheaper
        ?
        `
        <div class="card">

          ${prodCard(a.cheaper)}

          <p
            style="
              margin-top:8px;
              font-size:13px;
            "
          >
            Lower price than this product,
            same category.
          </p>

        </div>
        `
        :""
      }


      ${
        a.premium
        ?
        `
        <div class="card">

          ${prodCard(a.premium)}

          <p
            style="
              margin-top:8px;
              font-size:13px;
            "
          >
            A premium option
            in the same category.
          </p>

        </div>
        `
        :""
      }


      ${
        a.otherBrand
        ?
        `
        <div class="card">

          ${prodCard(a.otherBrand)}

          <p
            style="
              margin-top:8px;
              font-size:13px;
            "
          >
            From a different brand.
          </p>

        </div>
        `
        :""
      }


      ${
        a.stronger &&
        a.stronger.x.id!==p.id
        ?
        `
        <div class="card">

          ${prodCard(a.stronger.x)}

          <p
            style="
              margin-top:8px;
              font-size:13px;
            "
          >
            A stronger profile match
            (${a.stronger.m.score}%).
          </p>

        </div>
        `
        :""
      }

    </div>


    <div class="footer-note">

      Recommendations are based on
      the preferences and information
      you provided. They are not medical
      advice. Always check the current
      product label and consult a
      qualified professional for
      health-related concerns.

    </div>

  </div>

  `;

}


/* =========================================================
   BRAND
========================================================= */

function pageBrand(){

  const b=
    BRANDS[route.id];


  if(!b){

    return `
      <div class="section">
        <p>Brand not found.</p>
      </div>
    `;

  }


  const items=
    PRODUCTS.filter(
      p=>p.brand===route.id
    );


  const matched=
    profile
    ?
    items
      .map(p=>({
        p,
        m:computeMatch(p,profile)
      }))
      .sort((x,y)=>
        y.m.score-x.m.score
      )
    :
    items.map(p=>({
      p,
      m:null
    }));


  return `

  <div class="section">

    <a
      href="#"
      onclick="
        go('search',{tab:'brands'});
        return false;
      "
      style="font-size:13px;"
    >
      ← Back to brands
    </a>


    <h2 style="margin-top:10px;">
      ${b.name}
    </h2>

    <p>${b.desc}</p>


    <div style="margin-bottom:16px;">

      <span class="pill pill-blue">
        ${b.cat}
      </span>

      <span class="pill pill-blue">
        ${b.price}
      </span>

      ${
        b.sustainable
        ?
        `
        <span class="pill pill-green">
          Sustainable
        </span>
        `
        :""
      }

    </div>


    <h3>
      Products from ${b.name}
    </h3>


    <div class="grid g3">

      ${
        matched
          .map(t=>prodCard(t.p))
          .join("")
      }

    </div>

  </div>

  `;

}


/* =========================================================
   SAVED
========================================================= */

function pageSaved(){

  const items=
    PRODUCTS.filter(
      p=>saved.has(p.id)
    );


  return `

  <div class="section">

    <h2>Saved Products</h2>


    ${
      items.length

      ?

      `
      <div class="grid g3">

        ${
          items
            .map(prodCard)
            .join("")
        }

      </div>
      `

      :

      `
      <p class="empty">
        You haven't saved any products yet.
      </p>
      `
    }


    ${
      compareSet.size>0

      ?

      `
      <div style="margin-top:24px;">

        <button
          class="btn btn-primary"
          onclick="go('compare')"
        >
          Compare Selected
          (${compareSet.size})
        </button>

      </div>
      `

      :""
    }

  </div>

  `;

}


/* =========================================================
   COMPARE
========================================================= */

function pageCompare(){

  const items=
    PRODUCTS.filter(
      p=>compareSet.has(p.id)
    );


  if(items.length<2){

    return `

    <div class="section">

      <h2>Compare Products</h2>

      <p>
        Select at least 2 products
        using "+ Compare" on a
        product page.
      </p>

    </div>

    `;

  }


  const rows=[

    [
      "Brand",
      p=>BRANDS[p.brand].name
    ],

    [
      "Price",
      p=>"₹"+p.price
    ],

    [
      "Category",
      p=>p.cat
    ],

    [
      "Match Score",
      p=>{
        const m=
          computeMatch(p,profile);

        return m
          ?m.score+"%"
          :"Build profile";
      }
    ],

    [
      "Sustainable packaging",
      p=>
        p.attrs.sustainablePackaging
        ?"Yes"
        :"No"
    ],

    [
      "Ingredients/Materials",
      p=>
        p.attrs.ingredients.join(", ")
    ],

    [
      "Rating",
      p=>p.rating+" / 5"
    ]

  ];


  return `

  <div class="section">

    <h2>Compare Products</h2>


    <div class="scrollx">

      <table>

        <tr>

          <th></th>

          ${
            items.map(p=>`
              <th>${p.name}</th>
            `).join("")
          }

        </tr>


        ${
          rows.map(([label,fn])=>`

            <tr>

              <th>${label}</th>

              ${
                items.map(p=>`
                  <td>${fn(p)}</td>
                `).join("")
              }

            </tr>

          `).join("")
        }

      </table>

    </div>


    <p
      style="
        margin-top:16px;
        font-size:13.5px;
      "
    >
      Each product carries different
      trade-offs. Use the information
      above alongside your personal
      preferences rather than relying
      on a single number.
    </p>

  </div>

  `;

}


/* =========================================================
   AI
========================================================= */

function pageAI(){

  return `

  <div class="section">

    <h2>Ask Before You Buy</h2>

    <p>
      An assistant that answers using
      your actual profile and product
      data — it won't invent prices,
      ingredients or claims.
    </p>


    <div class="card">

      <div
        class="msgbox"
        id="msgbox"
      >

        <div class="msg ai">

          Hi${profile?" "+profile.name:""}!

          Ask me about a product you've
          viewed — for example:

          "Why does this match me?"

          or

          "What are cheaper alternatives?"

        </div>

      </div>


      <div
        style="
          display:flex;
          gap:8px;
          margin-top:12px;
        "
      >

        <input
          id="aiinput"
          placeholder="Ask a question..."
          onkeydown="
            if(event.key==='Enter')
              sendAI()
          "
        >

        <button
          class="btn btn-primary"
          onclick="sendAI()"
        >
          Ask
        </button>

      </div>


      <div style="margin-top:10px;">

        ${
          [
            "Why does this match me?",
            "What are cheaper alternatives?",
            "What should I check before buying?",
            "Which products from this brand match my preferences?"
          ]
          .map(q=>`

            <span
              class="chip"
              onclick="
                document.getElementById('aiinput').value='${q}';
                sendAI();
              "
            >
              ${q}
            </span>

          `)
          .join("")
        }

      </div>

    </div>

  </div>

  `;

}


window._lastProductId=null;


function sendAI(){

  const inp=
    document.getElementById(
      "aiinput"
    );


  const q=
    inp.value.trim();


  if(!q) return;


  const box=
    document.getElementById(
      "msgbox"
    );


  box.appendChild(
    createElement(
      `<div class="msg user">${q}</div>`
    )
  );


  inp.value="";


  const p=
    window._lastProductId
    ?
    PRODUCTS.find(
      x=>x.id===window._lastProductId
    )
    :null;


  let reply;


  if(!p){

    reply=
      "Open a product page first so I can reference its actual data — then ask me again.";

  }

  else if(!profile){

    reply=
      "I don't have your profile yet, so I can't compute a personalized match. Build your profile first.";

  }

  else{

    const m=
      computeMatch(
        p,
        profile
      );


    const a=
      alts(p);


    const ql=
      q.toLowerCase();


    if(
      ql.includes("why") ||
      ql.includes("match")
    ){

      reply=
        `${p.name} scores ${m.score}% for you. `+
        (
          m.reasons.length
          ?
          "It matches because: "+
          m.reasons.join("; ")+
          ". "
          :""
        )+
        (
          m.concerns.length
          ?
          "It loses points because: "+
          m.concerns.join("; ")+
          "."
          :""
        );

    }

    else if(
      ql.includes("cheap")
    ){

      reply=
        a.cheaper
        ?
        `A cheaper option is ${a.cheaper.name} by ${BRANDS[a.cheaper.brand].name} at ₹${a.cheaper.price}.`
        :
        "I don't have a cheaper option in the same category in this demo catalog.";

    }

    else if(
      ql.includes("check") ||
      ql.includes("verify") ||
      ql.includes("before buying")
    ){

      reply=
        "Before buying, verify: "+
        m.verify.join(", ")+
        ".";

    }

    else if(
      ql.includes("brand")
    ){

      const bItems=
        PRODUCTS
          .filter(x=>x.brand===p.brand)
          .map(x=>({
            x,
            mm:computeMatch(x,profile)
          }))
          .sort((a,b)=>
            b.mm.score-a.mm.score
          );


      reply=
        "From "+
        BRANDS[p.brand].name+
        ": "+
        bItems.map(
          t=>
            `${t.x.name} (${t.mm.score}%)`
        ).join(", ")+
        ".";

    }

    else{

      reply=
        "I can answer using this product's real data and your profile, but I don't have that specific detail on file — I won't guess at prices, ingredients or certifications I don't have.";

    }

  }


  box.appendChild(
    createElement(
      `<div class="msg ai">${reply}</div>`
    )
  );


  box.scrollTop=
    box.scrollHeight;

}


/* =========================================================
   SAFE ELEMENT HELPER
========================================================= */

function createElement(html){

  const d=
    document.createElement("div");

  d.innerHTML=html;

  return d.firstElementChild;

}


/* =========================================================
   SAVE / COMPARE
========================================================= */

function toggleSave(id){

  if(saved.has(id)){

    saved.delete(id);

  }else{

    saved.add(id);

  }

  render();

}


function toggleCompare(id){

  if(compareSet.has(id)){

    compareSet.delete(id);

  }else{

    compareSet.add(id);

  }

  render();

}


/* =========================================================
   ROUTER
========================================================= */

function render(){

  if(route.page==="product"){

    window._lastProductId=
      route.id;

  }


  const map={

    home:pageHome,

    profile:pageProfile,

    dashboard:pageDashboard,

    search:pageSearch,

    scan:pageScan,

    product:pageProduct,

    brand:pageBrand,

    saved:pageSaved,

    compare:pageCompare,

    ai:pageAI

  };


  document.getElementById(
    "app"
  ).innerHTML=
    (
      map[route.page] ||
      pageHome
    )();


  document
    .querySelectorAll(
      ".navlinks span, .bottomnav button"
    )
    .forEach(n=>{

      const target=
        n.getAttribute(
          "data-nav"
        );


      n.classList.toggle(
        "active",
        target===route.page ||
        (
          target==="home" &&
          route.page==="dashboard"
        )
      );

    });

}


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll("[data-nav]")
  .forEach(n=>{

    n.addEventListener(
      "click",
      ()=>{

        const t=
          n.getAttribute(
            "data-nav"
          );


        if(t==="home"){

          go(
            profile
            ?"dashboard"
            :"home"
          );

        }else{

          go(t);

        }

      }
    );

  });


/* =========================================================
   SPLASH SCREEN
========================================================= */

window.addEventListener(
  "load",
  ()=>{

    const splash=
      document.getElementById(
        "splash"
      );


    setTimeout(
      ()=>{

        if(splash){

          splash.remove();

        }

      },
      3500
    );

  }
);


/* =========================================================
   START APP
========================================================= */

go("home");

</script>

</body>
</html>
