/* =========================
   BASIC RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --navy:#07152f;
    --navy2:#0d2855;
    --blue:#285ee8;
    --blue2:#4d8cff;
    --white:#ffffff;
    --text:#12203d;
    --muted:#64718a;
    --border:#e5e9f2;
    --green:#168653;
    --red:#c63d3d;
    --shadow:0 10px 35px rgba(7,21,47,.12);
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 10%,rgba(77,140,255,.35),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(43,93,220,.35),transparent 30%),
        linear-gradient(135deg,#06142e,#0c2856,#142f68,#07152f);
    background-size:300% 300%;
    animation:gradientMove 14s ease infinite;
    min-height:100vh;
}

@keyframes gradientMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   STARTUP POPUP
========================= */

.startup{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,#285ee855,transparent 30%),
        radial-gradient(circle at 80% 80%,#4d8cff44,transparent 30%),
        linear-gradient(135deg,#030b1d,#0a1e43,#06152f);
    animation:startupFade 3.2s forwards;
}

.startup-box{
    text-align:center;
    color:white;
    animation:logoReveal 1.8s ease;
}

.startup-box h1{
    font-family:Georgia,serif;
    font-size:clamp(55px,12vw,110px);
    letter-spacing:12px;
    margin-bottom:10px;
    text-shadow:0 0 35px #4d8cff88;
}

.startup-box p{
    color:#cbd9ff;
    letter-spacing:4px;
    font-size:14px;
}

.startup-line{
    width:80px;
    height:3px;
    background:#5d95ff;
    margin:25px auto;
    border-radius:10px;
}

@keyframes logoReveal{
    from{
        opacity:0;
        transform:scale(.7);
        filter:blur(12px);
    }
    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

@keyframes startupFade{
    0%,80%{opacity:1;visibility:visible}
    100%{opacity:0;visibility:hidden}
}

/* =========================
   NAVBAR
========================= */

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
}

.topbar-inner{
    max-width:1150px;
    margin:auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:Georgia,serif;
    font-size:22px;
    font-weight:bold;
    color:var(--navy);
    letter-spacing:2px;
}

.navlinks{
    display:flex;
    gap:22px;
}

.navlinks button{
    background:none;
    border:0;
    color:#53617a;
    font-size:14px;
}

.navlinks button:hover{
    color:var(--blue);
}

@media(max-width:700px){
    .navlinks{
        display:none;
    }
}

/* =========================
   APP
========================= */

#app{
    max-width:1150px;
    margin:auto;
    padding:0 20px;
}

.section{
    padding:55px 0;
}

.card{
    background:rgba(255,255,255,.97);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    box-shadow:var(--shadow);
}

.grid{
    display:grid;
    gap:18px;
}

.g2{
    grid-template-columns:repeat(2,1fr);
}

.g3{
    grid-template-columns:repeat(3,1fr);
}

.g4{
    grid-template-columns:repeat(4,1fr);
}

@media(max-width:850px){
    .g3,.g4{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .g2,.g3,.g4{
        grid-template-columns:1fr;
    }
}

/* =========================
   TEXT
========================= */

h1,h2,h3,h4{
    font-family:Georgia,serif;
    color:var(--navy);

h1{
    font-size:clamp(32px,6vw,54px);

h2{
    font-size:34px;
    margin-bottom:10px;
}

h3{

p{

/* =========================

========================= */

.btn{

    border-radius:12px;
    padding:11px 18px;
    font-weight:600;
    font-size:14px;

.primary{
    background:linear-gradient(135deg,var(--blue),var(--blue2));

}

.secondary{
    background:white;
    border:1px solid var(--border);
    color:var(--navy);
}

.btn:hover{

}

/* =========================
   BACK BUTTON
========================= */

.back-btn{

    gap:7px;
    border:0;
    background:transparent;
    color:var(--blue);
    font-weight:600;
    margin-bottom:22px;

}

/* =========================
   HOME
========================= */

.hero p{

    font-size:17px;

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.category-card{
    text-align:center;
    cursor:pointer;
    transition:.25s;
}

.category-card:hover{
    transform:translateY(-6px);
}

.category-icon{
    font-size:48px;
    margin-bottom:12px;
}

/* =========================
   ITEM CARDS
========================= */

.item-card{

    text-align:center;
}

.item-card:hover{

}

.item-icon{

}

/* =========================

========================= */

.brand-card{

.brand-card:hover{

    border-color:#8aaaff;
}

/* =========================

========================= */

.product-card:hover{

}

    font-weight:600;
    margin-top:8px;
}

.blue{

.green{

.red{

/* =========================
   PROFILE
========================= */

label{
    display:block;
    font-weight:600;
    margin:15px 0 6px;

input,
select,
textarea{
    width:100%;

    border:1px solid var(--border);
    border-radius:10px;
    background:white;
    color:var(--text);

    display:flex;

.chip{
    border:1px solid var(--border);
    background:white;
    padding:8px 13px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;

.chip.selected{

/* =========================

========================= */

    }

        border:0;
        background:none;
        font-size:12px;
        color:var(--muted);
    }

    body{
        padding-bottom:65px;
    }
}
</style>

function goBack(){

    if(route.page==="items"){

    }

    else if(route.page==="brands"){
        go("items",{
            category:route.category
        });
    }

    else if(route.page==="products"){
        go("brands",{
            category:route.category,
            item:route.item
        });
    }

    else if(route.page==="product"){
        go("products",{
            category:route.category,
            item:route.item,
            brand:route.brand
        });
    }

    else{
        go("home");
    }
}

/* =========================================================
   PROFILE
========================================================= */

const PROFILE_OPTIONS={

    lifestyle:[
        "Eco-conscious",
        "Budget-focused",
        "Health-conscious",
        "Active",
        "Minimalist"
    ],

    allergies:[
        "Peanuts",
        "Tree nuts",
        "Milk",
        "Gluten",
        "Soy",
        "Egg",
        "Fragrance",
        "Other"
    ],

    diseases:[
        "Diabetes",
        "Hypertension",
        "High cholesterol",
        "PCOS",
        "Thyroid condition",
        "Other"
    ],

    favourites:[
        "Rice",
        "Oats",
        "Chocolate",
        "Biscuits",
        "Soap",
        "Shampoo",
        "Toothpaste"
    ]
};


let tempProfile={
    lifestyle:[],
    allergies:[],
    diseases:[],
    favourites:[],
    likedProducts:""
};


function toggleProfile(field,value,element){

    if(!tempProfile[field]){
        tempProfile[field]=[];
    }

    const index=tempProfile[field].indexOf(value);

    if(index>=0){
        tempProfile[field].splice(index,1);
        element.classList.remove("selected");
    }
    else{
        tempProfile[field].push(value);
        element.classList.add("selected");
    }
}


function profileChips(field){

    return PROFILE_OPTIONS[field].map(option=>`

        <button
            type="button"
            class="chip ${
                tempProfile[field].includes(option)
                ?"selected":""
            }"
            onclick="toggleProfile(
                '${field}',
                '${option}',
                this
            )">

            ${option}

        </button>

    `).join("");
}


function pageProfile(){

    return `

    <section class="section">

        <button class="back-btn"
                onclick="go('home')">
            ← Back
        </button>

        <h2>My PICKSY Profile</h2>

        <p>
            Tell PICKSY what matters to you so that
            product information can be personalised.
        </p>


        <div class="card">

            <label>Name</label>

            <input
                id="profileName"
                placeholder="Your name"
                value="${profile?.name||""}"
            >


            <label>
                Approximate shopping budget (₹)
            </label>

            <input
                id="profileBudget"
                type="number"
                value="${profile?.budget||500}"
            >


            <label>Lifestyle</label>

            <div class="chips">
                ${profileChips("lifestyle")}
            </div>


            <label>
                Allergies / Ingredients you need to avoid
            </label>

            <div class="chips">
                ${profileChips("allergies")}
            </div>


            <label>
                Diseases / Health-related dietary concerns
            </label>

            <p style="font-size:13px">
                Only add information you want PICKSY to use
                when filtering products. This is not medical advice.
            </p>

            <div class="chips">
                ${profileChips("diseases")}
            </div>


            <label>
                Favourite products / product types
            </label>

            <div class="chips">
                ${profileChips("favourites")}
            </div>


            <label>
                Products you have liked before
            </label>

            <textarea
                id="likedProducts"
                rows="4"
                placeholder="Example: I liked Quaker Oats, Dove Soap and Amul Dark Chocolate."
            >${profile?.likedProducts||""}</textarea>


            <label>
                Sustainability importance
            </label>

            <select id="sustainability">

                <option>Low</option>
                <option>Medium</option>
                <option>High</option>

            </select>


            <label>
                Main shopping priority
            </label>

            <select id="priority">

                <option>Health & Ingredient Safety</option>
                <option>Value for Money</option>
                <option>Sustainability</option>
                <option>Brand Trust</option>
                <option>Personal Preference</option>

            </select>


            <div style="margin-top:22px">

                <button
                    class="btn primary"
                    onclick="saveProfile()">

                    Save My PICKSY Profile

                </button>

            </div>

        </div>

    </section>
    `;
}


function saveProfile(){

    profile={

        name:
            document.getElementById("profileName").value
            ||"You",

        budget:
            Number(
                document.getElementById("profileBudget").value
            )||500,

        lifestyle:
            [...tempProfile.lifestyle],

        allergies:
            [...tempProfile.allergies],

        diseases:
            [...tempProfile.diseases],

        favourites:
            [...tempProfile.favourites],

        likedProducts:
            document.getElementById("likedProducts").value,

        sustainability:
            document.getElementById("sustainability").value,

        priority:
            document.getElementById("priority").value
    };

    sessionStorage.setItem(
        "picksY_profile",
        JSON.stringify(profile)
    );

    alert("Your PICKSY profile has been saved!");

    go("home");
}

========================================================= */

function pageAI(){

    return `

    <section class="section">

        <button class="back-btn"
                onclick="go('home')">
            ← Back
        </button>

        <h2>Ask PICKSY AI</h2>

                rows="4"
                placeholder="Example: Which oats may suit my preferences?"
            ></textarea>

            <button
                class="btn primary"

                onclick="askAI()">

            </button>

            <div
                id="aiAnswer"
                style="margin-top:20px">
            </div>

        </div>

}


function askAI(){

    const question=
        document.getElementById("aiQuestion")
        .value
        .trim();

    if(!question){
        return;
    }

    document.getElementById("aiAnswer").innerHTML=`

        <div class="card"
             style="background:#f1f5ff">

            <h3>PICKSY AI</h3>

            <p>
                I can analyse products using the information
                in your PICKSY profile. For reliable results,
                always check the current package label,
                ingredients, allergy warnings and price before
                purchasing.
            </p>

        </div>

    `;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    let content="";

    switch(route.page){

        case "home":
            content=pageHome();
            break;

        case "search":
            content=pageSearch();
            break;

        case "items":
            content=pageItems();
            break;

        case "brands":
            content=pageBrands();
            break;

        case "products":
            content=pageProducts();
            break;

        case "product":
            content=pageProduct();
            break;

        case "profile":
            content=pageProfile();
            break;

        case "saved":
            content=pageSaved();
            break;

        case "ai":
            content=pageAI();
            break;

        default:
            content=pageHome();
    }

    document.getElementById("app").innerHTML=content;
}


/* =========================================================
   INITIAL LOAD
========================================================= */

render();

</script>
