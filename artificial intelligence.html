/* =========================

========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

:root{
    --navy:#075A61;
    --navy2:#0d6f76;
    --blue:#3F9FA8;
    --blue2:#63b8bf;
    --aqua:#B9DDE0;
    --ivory:#F7F5EF;
    --white:#FFFFFF;
    --text:#173b40;
    --muted:#647b80;
    --border:#dce9e9;
    --green:#168653;
    --red:#c63d3d;
    --shadow:0 10px 35px rgba(7,90,97,.12);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at 15% 20%,

            transparent 28%
        ),
        radial-gradient(
            circle at 85% 15%,
            rgba(63,159,168,.30),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #075A61 0%,
            #3F9FA8 35%,
            #B9DDE0 70%,
            #F7F5EF 100%
        );

    background-size:300% 300%;
    animation:gradientMove 18s ease infinite;

    min-height:100vh;
    position:relative;
    overflow-x:hidden;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================
   SUBTLE OCEAN RIPPLE
========================= */

body::before,
body::after{
    content:"";
    position:fixed;
    left:-10%;
    width:120%;
    height:45vh;
    pointer-events:none;
    z-index:-1;
    border-radius:50%;
}

body::before{

    top:18%;

    background:
        repeating-radial-gradient(
            ellipse at center,
            rgba(255,255,255,.42) 0px,
            rgba(255,255,255,.42) 2px,
            transparent 3px,
            transparent 34px
        );

    filter:blur(1px);

    opacity:.22;

    animation:
        oceanRipple
        18s
        ease-in-out
        infinite;
}

body::after{

    bottom:5%;

    background:
        repeating-radial-gradient(
            ellipse at center,
            rgba(7,90,97,.25) 0px,
            rgba(7,90,97,.25) 2px,
            transparent 4px,
            transparent 42px
        );

    filter:blur(2px);

    opacity:.22;

    animation:
        oceanRippleReverse
        24s
        ease-in-out
        infinite;
}


@keyframes gradientMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


@keyframes oceanRipple{

    0%{
        transform:
            translate3d(-4%,0,0)
            scale(1);
    }

    50%{
        transform:
            translate3d(4%,2%,0)
            scale(1.06);
    }

    100%{
        transform:
            translate3d(-4%,0,0)
            scale(1);
    }

}


@keyframes oceanRippleReverse{

    0%{
        transform:
            translate3d(4%,0,0)
            scale(1.04);
    }

    50%{
        transform:
            translate3d(-4%,-2%,0)
            scale(1);
    }

    100%{
        transform:
            translate3d(4%,0,0)
            scale(1.04);
    }

}


/* =========================
   STARTUP POPUP
========================= */

.startup{

    position:fixed;
    inset:0;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 20% 20%,
            #3F9FA855,
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            #B9DDE044,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #043b40,
            #075A61,
            #0d6f76
        );

    animation:
        startupFade
        3.2s
        forwards;
}

.startup-box{
    text-align:center;
    color:white;
    animation:
        logoReveal
        1.8s
        ease;
}

.startup-box h1{

    font-family:Georgia,serif;

    font-size:
        clamp(
            55px,
            12vw,
            110px

    letter-spacing:12px;
    margin-bottom:10px;

    text-shadow:
        0 0 35px
        rgba(185,221,224,.55);
}

.startup-box p{

    color:#d9f1f2;

    letter-spacing:4px;

    font-size:14px;
}

.startup-line{

    width:80px;
    height:3px;

    background:#B9DDE0;

    margin:25px auto;

    border-radius:10px;
}

@keyframes logoReveal{

    from{
        opacity:0;
        transform:scale(.7);
        filter:blur(12px);
    }

    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }

}

@keyframes startupFade{

    0%,80%{
        opacity:1;
        visibility:visible;
    }

    100%{
        opacity:0;
        visibility:hidden;
    }

}

/* =========================================================
   PRODUCT SUITABILITY
========================================================= */

function evaluateProduct(product){

    if(!profile){

        return {

            status:"unknown",

            title:
                "Profile not available",

            reasons:[

                "Create your PICKSY profile to check suitability.",

                "PICKSY can then compare the product with your allergies, health concerns and budget."

            ]

        };

    }

    const reasons=[];

    let seriousIssue=false;

    let warning=false;


    const productAllergens=
        (product.allergens||[])
        .map(x=>x.toLowerCase());


    const productIngredients=
        (product.ingredients||[])
        .map(x=>x.toLowerCase());


    const userAllergies=
        (profile.allergies||[])
        .map(x=>x.toLowerCase());


    userAllergies.forEach(allergy=>{

        const allergyFound=

            productAllergens.some(a=>
                a.includes(allergy) ||
                allergy.includes(a)
            )

            ||

            productIngredients.some(i=>
                i.includes(allergy) ||
                allergy.includes(i)
            );


        if(allergyFound){

            seriousIssue=true;

            reasons.push(
                `Possible match with your listed allergy/avoidance: ${allergy}.`
            );

        }

    });


    if(profile.budget && product.price){

        if(product.price > profile.budget){

            warning=true;

            reasons.push(
                `Price ₹${product.price} is above your saved budget of ₹${profile.budget}.`
            );

        }

        else{

            reasons.push(
                `Price ₹${product.price} is within your saved budget of ₹${profile.budget}.`
            );

        }

    }


    if(
        profile.diseases &&
        profile.diseases.length
    ){

        reasons.push(
            `Your profile includes: ${profile.diseases.join(", ")}. Check the current nutrition/ingredient label for compatibility.`
        );

    }


    if(
        profile.favourites &&
        profile.favourites.some(
            f=>
                f.toLowerCase()===
                route.item.toLowerCase()
        )
    ){

        reasons.push(
            "This product type is listed among your favourites."
        );

    }


    if(seriousIssue){

        return {

            status:"bad",

            title:
                "May not suit your profile",

            reasons

        };

    }


    if(warning){

        return {

            status:"warning",

            title:
                "Review before buying",

            reasons

        };

    }


    return {

        status:"good",

        title:
            "Looks suitable based on your profile",

        reasons:
            reasons.length
            ?
            reasons
            :
            [
                "No conflict was identified from the information currently stored in your profile."
            ]

    };

}


/* =========================================================
   SUITABILITY HTML
========================================================= */

function suitabilityHTML(product){

    const result=
        evaluateProduct(product);

    let className=
        "suitability-unknown";


    if(result.status==="good"){

        className=
            "suitability-good";

    }

    else if(result.status==="warning"){

        className=
            "suitability-warning";

    }

    else if(result.status==="bad"){

        className=
            "suitability-bad";

    }


    return `

        <div
            class="suitability-box ${className}">

            <strong>
                ${result.title}
            </strong>

            <ul
                style="margin-top:8px">

                ${result.reasons.map(reason=>`

                    <li>
                        ${reason}
                    </li>

                `).join("")}

            </ul>

        </div>

    `;

}

function createProductKey(

    product,
    index

    );

}

/* =========================================================
   COMPARE SELECTION
========================================================= */

function toggleCompare(
    index,
    item,
    brand
){

    let products=
        PRODUCTS[item] || [];


    if(brand){

        products=
            products.filter(
                p=>p.brand===brand
            );

    }


    if(products.length===0){

        products=[

            {

                name:
                    `${brand} ${item}`,

                brand:brand,

                price:199,

                rating:4.3,

                description:
                    `${brand} ${item} product.`,

                ingredients:[
                    "See package label"
                ],

                allergens:[]

            },

            {

                name:
                    `${brand} ${item} Premium`,

                brand:brand,

                price:299,

                rating:4.4,

                description:
                    `A premium ${item} option from ${brand}.`,

                ingredients:[
                    "See package label"
                ],

                allergens:[]

            }

        ];

    }


    const product=
        products[index];


    if(!product){

        return;

    }


    const key=
        createProductKey(
            item,
            product,
            index
        );


    const existing=
        compareSelection.findIndex(
            x=>x.key===key
        );


    if(existing>=0){

        compareSelection.splice(
            existing,
            1
        );

    }

    else{

        const differentItem=
            compareSelection.find(
                x=>x.item!==item
            );


        if(differentItem){

            alert(
                "You can compare products only from the same item."
            );

            render();

            return;

        }


        compareSelection.push({

            key:key,

            item:item,

            category:
                route.category,

            brand:
                product.brand,

            product:
                product

        });

    }


    render();

}

========================================================= */

function comparisonSuitability(product){

    const result=
        evaluateProduct(product);

    let className=
        "suitability-unknown";


    if(result.status==="good"){

        className=
            "suitability-good";

    }

    else if(result.status==="warning"){

        className=
            "suitability-warning";

    }

    else if(result.status==="bad"){

        className=
            "suitability-bad";

    }


    return `

        <div
            class="suitability-box ${className}"
            style="margin-top:0">

            <strong>
                ${result.title}
            </strong>

            <ul
                style="margin-top:8px">

                ${result.reasons.map(reason=>`

                    <li>
                        ${reason}
                    </li>

                `).join("")}

            </ul>

        </div>

    `;

}

========================================================= */

function startCompareFromProduct(){

    let products=
        PRODUCTS[route.item] || [];


    if(products.length===0){

        alert(
            "Comparison data for this item is not available yet."
        );

        return;

    }


    const currentProduct=
        products.find(
            p=>
                p.name===
                decodeURIComponent(
                    route.productName||""
                )
        );


    if(currentProduct){

        const key=
            createProductKey(
                route.item,
                currentProduct,
                products.indexOf(
                    currentProduct
                )
            );


        if(
            !compareSelection.some(
                x=>x.key===key
            )
        ){

            compareSelection.push({

                key:key,

                item:
                    route.item,

                category:
                    route.category,

                brand:
                    currentProduct.brand,

                product:
                    currentProduct

            });

        }

    }


    go(
        "products",
        {
            category:
                route.category,

            item:
                route.item
        }
    );

}

function toggleProfile(
    field,
    value,
    element
){

    if(!tempProfile[field]){

        tempProfile[field]=[];

    }


    const index=
        tempProfile[field].indexOf(
            value
        );


    if(index>=0){

        tempProfile[field].splice(
            index,
            1
        );

        element.classList.remove(
            "selected"
        );

    }

    else{

        tempProfile[field].push(
            value
        );

        element.classList.add(
            "selected"
        );

    }

}


function profileChips(field){

    return PROFILE_OPTIONS[field]
        .map(option=>`

        <button
            type="button"
            class="chip ${
                tempProfile[field]
                .includes(option)
                ?"selected":""
            }"
            onclick="
                toggleProfile(
                    '${field}',
                    '${option}',
                    this
                )
            ">

            ${option}

        </button>

    `)
    .join("");

}

/* =========================================================
   AI — PROFILE AWARE ANSWER
========================================================= */

function askAI(){

    const question=
        document
        .getElementById(
            "aiQuestion"
        )
        .value
        .trim();


    if(!question){

        return;

    }


    const answerBox=
        document.getElementById(
            "aiAnswer"
        );


    /*
       PROFILE REQUIRED FOR PERSONALISATION
    */

    if(!profile){

        answerBox.innerHTML=`

            <div
                class="card"
                style="
                    background:#f1f8f8;
                    border-color:#b9dfe1
                ">

                <h3
                    style="color:#075A61">

                    PICKSY AI

                </h3>

                <p>

                    I can help you with that, but you
                    haven't created a PICKSY profile yet.

                </p>

                <p>

                    Create your profile with your budget,
                    allergies, health-related concerns,
                    lifestyle and favourite products so
                    I can give you a more personalised answer.

                </p>

                <button
                    class="btn primary"
                    onclick="go('profile')">

                    Build My Profile

                </button>

            </div>

        `;

        return;

    }


    const name=
        profile.name ||
        "You";


    const budget=
        profile.budget
        ?
        `₹${profile.budget}`
        :
        "not specified";


    const lifestyle=
        profile.lifestyle &&
        profile.lifestyle.length
        ?
        profile.lifestyle.join(", ")
        :
        "not specified";


    const allergies=
        profile.allergies &&
        profile.allergies.length
        ?
        profile.allergies.join(", ")
        :
        "none listed";


    const diseases=
        profile.diseases &&
        profile.diseases.length
        ?
        profile.diseases.join(", ")
        :
        "none listed";


    const favourites=
        profile.favourites &&
        profile.favourites.length
        ?
        profile.favourites.join(", ")
        :
        "none listed";


    const priority=
        profile.priority ||
        "not specified";


    const q=
        question.toLowerCase();


    /*
       COLLECT ALL PRODUCTS
    */

    const allProducts=[];


    Object.keys(PRODUCTS)
        .forEach(item=>{

            PRODUCTS[item]
                .forEach(product=>{

                    allProducts.push({

                        ...product,

                        item:item

                    });

                });

        });


    /*
       FIND DIRECT PRODUCT MATCHES
    */

    let relevantProducts=
        allProducts.filter(
            product=>{

                return (

                    product.name
                        .toLowerCase()
                        .includes(q)

                    ||

                    product.brand
                        .toLowerCase()
                        .includes(q)

                    ||

                    product.item
                        .toLowerCase()
                        .includes(q)

                    ||

                    product.description
                        .toLowerCase()
                        .includes(q)

                );

            }
        );


    /*
       KEYWORD SEARCH
    */

    if(
        relevantProducts.length===0
    ){

        const keywords=
            q
            .split(/\s+/)
            .filter(
                word=>
                    word.length>3
            );


        relevantProducts=
            allProducts.filter(
                product=>{

                    const searchable=`

                        ${product.name}

                        ${product.brand}

                        ${product.item}

                        ${product.description}

                        ${(product.ingredients||[]).join(" ")}

                    `
                    .toLowerCase();


                    return keywords.some(
                        keyword=>
                            searchable.includes(
                                keyword
                            )
                    );

                }
            );

    }


    /*
       REMOVE DUPLICATES
    */

    relevantProducts=
        relevantProducts.filter(
            (product,index,self)=>
                index===
                self.findIndex(
                    p=>
                        p.name===
                        product.name
                )
        );


    /*
       ANALYSE AGAINST PROFILE
    */

    const analysedProducts=
        relevantProducts.map(
            product=>{

                const result=
                    evaluateProductForAI(
                        product
                    );


                return {

                    product,
                    result

                };

            }
        );


    /*
       KEEP PROFILE-CONFLICTING PRODUCTS
       CLEARLY SEPARATED.
    */

    analysedProducts.sort(
        (a,b)=>{

            const order={

                good:0,
                unknown:1,
                warning:2,
                bad:3

            };

            return(
                order[a.result.status]-
                order[b.result.status]
            );

        }
    );


    let response="";


    /*
       BUDGET QUESTIONS
    */

    if(

        q.includes("budget") ||

        q.includes("cheap") ||

        q.includes("afford") ||

        q.includes("price")

    ){

        const withinBudget=
            allProducts.filter(
                product=>
                    product.price<=
                    profile.budget
            );


        if(
            withinBudget.length
        ){

            const examples=
                withinBudget
                .slice(0,5)
                .map(
                    product=>
                        `${product.name} (₹${product.price})`
                )
                .join(", ");


            response+=`

                <p>

                    Based on your saved budget of
                    <strong>
                        ₹${profile.budget}
                    </strong>,
                    some products in the current PICKSY
                    database within that amount include:

                    <strong>
                        ${examples}
                    </strong>.

                </p>

            `;

        }

    }


    /*
       ALLERGY / INGREDIENT QUESTIONS
    */

    if(

        q.includes("allerg") ||

        q.includes("ingredient") ||

        q.includes("safe") ||

        q.includes("avoid")

    ){

        response+=`

            <p>

                Your saved ingredients/allergies to avoid are:

                <strong>
                    ${allergies}
                </strong>.

            </p>

        `;


        if(
            analysedProducts.length
        ){

            response+=`

                <p>

                    For the products I found, PICKSY checks
                    the ingredient and allergen information
                    currently stored in its database against
                    your profile.

                </p>

            `;

        }

    }


    /*
       PREFERENCE QUESTIONS
    */

    if(

        q.includes("preference") ||

        q.includes("prefer") ||

        q.includes("favourite") ||

        q.includes("recommend") ||

        q.includes("suit") ||

        q.includes("right for me")

    ){

        response+=`

            <p>

                I'm using your PICKSY preferences:

                <strong>
                    ${lifestyle}
                </strong>

                lifestyle,

                <strong>
                    ${priority}
                </strong>

                as your main shopping priority,
                and favourites including

                <strong>
                    ${favourites}
                </strong>.

            </p>

        `;

    }


    /*
       DISPLAY RELEVANT PRODUCTS
    */

    if(
        analysedProducts.length
    ){

        response+=`

            <h3
                style="margin-top:18px">

                Based on your profile

            </h3>

        `;


        analysedProducts
            .slice(0,5)
            .forEach(
                ({product,result})=>{

                    let color=
                        "#eef5f5";


                    if(
                        result.status==="good"
                    ){

                        color=
                            "#e6f7ed";

                    }

                    else if(
                        result.status==="warning"
                    ){

                        color=
                            "#fff5df";

                    }

                    else if(
                        result.status==="bad"
                    ){

                        color=
                            "#fdeaea";

                    }


                    response+=`

                        <div

                            style="
                                margin-top:12px;
                                padding:15px;
                                border-radius:14px;
                                background:${color};
                                border:1px solid #e1e6ef;
                            "

                        >

                            <strong>
                                ${product.name}
                            </strong>

                            <p
                                style="margin-top:5px">

                                ${product.description}

                            </p>

                            <p>

                                Price:

                                    ₹${product.price}
                                </strong>

                                Rating:

                            </p>


                            <strong>
                                ${result.title}
                            </strong>


                            <ul
                                style="margin-top:7px">

                                ${result.reasons
                                    .slice(0,3)
                                    .map(
                                        reason=>`

                                            <li>
                                                ${reason}
                                            </li>

                                        `
                                    )
                                    .join("")}

                            </ul>

                        </div>

                    `;

                }
            );

    }


    /*
       GENERAL PROFILE RESPONSE
    */

    if(!response){

        response=`

            <p>

                I understand your question:

                <strong>
                    "${question}"
                </strong>

            </p>


            <p>

                Based on your PICKSY profile, your current
                shopping budget is

                <strong>
                    ${budget}
                </strong>,

                <strong>

                </strong>.

            </p>


            <p>

                Your listed allergies or ingredients to avoid

                    ${allergies}
                </strong>,

                and your saved health-related concerns are

                <strong>
                    ${diseases}
                </strong>.

            </p>


            <p>

                I couldn't find a specific product in the
                current PICKSY database that directly matches
                your question.

                Try asking about a product, ingredient,
                brand, price, allergy, or preference.

            </p>

        `;

    }


    /*
       VERIFICATION REMINDER
    */

    response+=`

        <div

            style="
                margin-top:18px;
                padding:13px;
                border-radius:12px;
                background:#f1f8f8;
                border:1px solid #c5e1e3;
            "

        >

            <strong
                style="color:#075A61">

                PICKSY reminder

            </strong>


            <p
                style="margin-top:5px">

                This answer is based on the information
                currently stored in your PICKSY profile and
                PICKSY's product data.

                Always verify the current package label,
                complete ingredients, allergen statement,
                nutrition information and price before
                purchasing.

                PICKSY does not replace professional

            </p>

        </div>

    `;


    answerBox.innerHTML=`

        <div

            class="card"

            style="
                background:#ffffff;
                border-color:#b9dde0;
                margin-top:15px;
            "

        >

            <h3
                style="color:#075A61">

                PICKSY AI

            </h3>

            ${response}

        </div>

    `;

}


/* =========================================================
   AI PROFILE-BASED PRODUCT EVALUATION
========================================================= */

function evaluateProductForAI(product){

    if(!profile){

        return {

            status:"unknown",

            title:
                "Profile not available",

            reasons:[

                "Create a PICKSY profile to personalise this answer."

            ]

        };

    }


    const reasons=[];

    let seriousIssue=false;

    let warning=false;


    const productAllergens=
        (product.allergens||[])
        .map(
            x=>x.toLowerCase()
        );


    const productIngredients=
        (product.ingredients||[])
        .map(
            x=>x.toLowerCase()
        );


    const userAllergies=
        (profile.allergies||[])
        .map(
            x=>x.toLowerCase()
        );


    /*
       ALLERGY MATCHING
    */

    userAllergies
        .forEach(
            allergy=>{

                const allergyFound=

                    productAllergens.some(
                        allergen=>
                            allergen.includes(
                                allergy
                            )
                            ||
                            allergy.includes(
                                allergen
                            )
                    )

                    ||

                    productIngredients.some(
                        ingredient=>
                            ingredient.includes(
                                allergy
                            )
                            ||
                            allergy.includes(
                                ingredient
                            )
                    );


                if(allergyFound){

                    seriousIssue=true;

                    reasons.push(
                        `Possible match with your listed allergy/avoidance: ${allergy}.`
                    );

                }

            }
        );


    /*
       BUDGET MATCHING
    */

    if(
        profile.budget &&
        product.price
    ){

        if(
            product.price>
            profile.budget
        ){

            warning=true;

            reasons.push(
                `₹${product.price} is above your saved budget of ₹${profile.budget}.`
            );

        }

        else{

            reasons.push(
                `₹${product.price} is within your saved budget of ₹${profile.budget}.`
            );

        }

    }


    /*
       FAVOURITE PRODUCT TYPE
    */

    if(

        profile.favourites &&

        profile.favourites.some(
            favourite=>
                favourite.toLowerCase()===
                product.item.toLowerCase()
        )

    ){

        reasons.push(
            "This product type is listed among your favourites."
        );

    }


    /*
       HEALTH PROFILE REMINDER
    */

    if(

        profile.diseases &&
        profile.diseases.length

    ){

        reasons.push(

            `Your profile includes ${profile.diseases.join(", ")}. Check the current package nutrition and ingredient information for compatibility.`

        );

    }


    if(seriousIssue){

        return {

            status:"bad",

            title:
                "Potential profile conflict",

            reasons

        };

    }


    if(warning){

        return {

            status:"warning",

            title:
                "Review before buying",

            reasons

        };

    }


    return {

        status:"good",

        title:
            "No conflict identified from your saved profile",

        reasons:
            reasons.length
            ?
            reasons
            :
            [

                "No conflict was identified using the information currently stored in your profile."

            ]

    };

}
